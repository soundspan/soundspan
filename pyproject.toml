# Tool configuration only: this npm-orchestrated monorepo is not a Python package.

[tool.ruff]
target-version = "py311"
line-length = 100
include = ["services/**/*.py"]

[tool.ruff.lint]
select = [
  "ASYNC",
  "B",
  "C4",
  "E",
  "F",
  "G",
  "I",
  "LOG",
  "PIE",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
  "W",
]
ignore = [
  "E501", # Existing long lines need a separate, formatter-aware cleanup.
  "G004", # Rewriting nearly 200 established f-string log calls is outside this baseline.
  "ISC001", # This conflicts with Ruff's formatter and the rollout is lint-only for now.
]

[tool.ruff.lint.per-file-ignores]
"services/audio-analyzer/analyzer.py" = [
  "E402", # Environment and multiprocessing setup must run before heavy optional imports.
]
"services/**/tests/**/*.py" = [
  "S101", # Pytest assertions are the test framework's expected assertion mechanism.
  "S105", # Test fixtures intentionally use token-like placeholder strings.
  "S106", # Test calls intentionally pass token-like placeholder strings.
]
"services/*/app.py" = [
  "B008", # FastAPI Depends and Query objects are intentionally constructed as defaults.
]
"services/tidal-streamer/app.py" = [
  "B008", # FastAPI Depends and Query objects are intentionally constructed as defaults.
  "B904", # Endpoint handlers intentionally translate provider failures into stable HTTP errors.
  "E402", # The shared-service path bootstrap must run before local imports.
]
"services/ytmusic-streamer/app.py" = [
  "ASYNC240", # Small local credential-path operations are bounded and predate async file support.
  "B008", # FastAPI Depends and Query objects are intentionally constructed as defaults.
  "B904", # Endpoint handlers intentionally translate provider failures into stable HTTP errors.
  "E402", # The shared-service path bootstrap must run before local imports.
]
"services/ytmusic-streamer/ytmusic_*.py" = [
  "ASYNC240", # Moved credential-path operations retain the app.py exemption.
  "B008", # Moved FastAPI Depends and Query defaults retain the app.py exemption.
  "B904", # Moved handlers retain their existing stable HTTP error translations.
  "E402", # ytmusic_runtime bootstraps the shared-service import path.
]
"services/ytmusic-streamer/ytmusic_stream.py" = [
  "RUF100", # Preserve the verbatim LOG014 rationale on the moved extraction helper.
]

[tool.mypy]
# Python 3.11 matches the repo floor (Ruff py311 and audio-analyzer python:3.11-slim),
# so mypy checks against the oldest interpreter the sidecars run on.
python_version = "3.11"
files = ["services/common"]
mypy_path = ["services"]
strict = true
warn_unreachable = true
disallow_any_unimported = true
show_error_codes = true
# Allow package-specific follow_imports overrides to apply to incompatible stubs too.
follow_imports_for_stubs = true

[[tool.mypy.overrides]]
# tiddl 3.4.4 does not publish PEP 561 type information (7 import diagnostics).
module = ["tiddl", "tiddl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Mutagen 1.48.1 marks itself typed, but its file loaders and tag mappings remain untyped.
module = ["mutagen", "mutagen.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# yt-dlp 2026.7.4 does not publish PEP 561 type information (2 import diagnostics).
module = ["yt_dlp", "yt_dlp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Essentia has no PEP 561 metadata in the analyzer environment (2 import diagnostics).
module = ["essentia", "essentia.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# librosa has no PEP 561 metadata in the DCLAP environment.
module = ["librosa", "librosa.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ONNX Runtime publishes no usable PEP 561 metadata in the DCLAP quality environment.
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Transformers is runtime-only and absent from the dependency-light DCLAP quality environment.
module = ["transformers", "transformers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# psycopg2 has no bundled typing metadata in the audio analyzer environment.
module = ["psycopg2", "psycopg2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# redis is absent from the minimal analyzer check environments (2 import diagnostics).
module = ["redis", "redis.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# NumPy 2.5 stubs require Python 3.12 syntax while this gate targets Python 3.11
# (1 transitive syntax diagnostic); the analyzer module owns its NumPy boundaries.
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[[tool.mypy.overrides]]
# The audio analyzer is a standalone top-level `analyzer` module. Measured strict debt:
# - audio-analyzer/analyzer.py: 91 errors (51 no-untyped-call, 33 no-untyped-def,
#   3 union-attr, 2 unreachable, 2 no-any-unimported).
module = ["analyzer"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_generics = false
disallow_any_unimported = false
warn_unreachable = false
disable_error_code = ["assignment", "attr-defined", "union-attr"]
