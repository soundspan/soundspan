# Dependabot version-update configuration (docs/modernization-roadmap.md F45,
# epic #10, #59 WS2.4).
#
# Grouping rationale: this is a single-operator homelab (see AGENTS.md) --
# one PR per bumped dependency per week, per ecosystem, is unreviewable
# noise for one person. Every ecosystem/directory below groups its own
# minor+patch updates into a single weekly PR; major-version bumps (which
# can be breaking) are deliberately left *ungrouped* so each lands as its
# own, individually reviewable PR instead of being buried in a batch.
# `open-pull-requests-limit: 5` caps how many PRs (grouped + major, combined)
# any one ecosystem/directory can have open at once.
#
# Do NOT add `ignore:` rules for yt-dlp or ytmusicapi (services/ytmusic-streamer)
# anywhere in this file. Those pins are deliberately loose -- YouTube-side
# breakage fixes land as new yt-dlp releases, so Dependabot pressure on them
# is wanted, not noise. See the soundspan-sidecars skill and F45's notes.
version: 2

updates:
  # --- npm: 4 manifests (root orchestration + backend + frontend + the
  # media-metadata-contract package) ---------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Runtime images + CI are node:24 (backend/frontend/AIO Dockerfiles,
      # setup-node). @types/node majors ride along with the base-image move,
      # not ahead of it — types-25 lets Node-25-only APIs typecheck and then
      # crash on the node:24 images (Dependabot #181). Raise together with
      # the image bump.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # ts-jest peers `typescript >=4.3 <7` (29.4.11, latest as of
      # 2026-07-21), so TS 7 is un-installable: npm ci fails ERESOLVE before
      # any job runs (Dependabot #180). TS 6.x stays allowed. Drop this when
      # ts-jest ships TypeScript-7 support.
      - dependency-name: "typescript"
        versions: [">= 7"]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/packages/media-metadata-contract"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # --- pip: the 4 Python sidecar services ----------------------------------
  # ytmusic-streamer's yt-dlp / ytmusicapi pins are deliberately loose (see
  # header note above) -- no ignore rules for them here, ever.
  - package-ecosystem: pip
    directory: "/services/audio-analyzer"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # This image is Ubuntu 20.04 / Python 3.8, held there by
      # essentia-tensorflow (links the TF 2.13–2.15 ABI; the last cp38 TF
      # wheel is 2.13.x). Both floors below are unresolvable, verified with
      # `uv pip compile --python-version 3.8` (Dependabot #165/#167):
      # redis-py ≥7 requires newer Python (the py3.8 ceiling is 6.x), and
      # TF ≥2.16 breaks the essentia ABI and ships no cp38 wheels. Revisit
      # only if the analyzer ever leaves py3.8.
      - dependency-name: "redis"
        versions: [">= 7"]
      - dependency-name: "tensorflow"
        versions: [">= 2.16"]

  - package-ecosystem: pip
    directory: "/services/audio-analyzer-clap"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: "/services/tidal-downloader"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: "/services/ytmusic-streamer"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # --- docker: all 7 Dockerfile directories --------------------------------
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/services/audio-analyzer"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/services/audio-analyzer-clap"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # The clap requirements.lock pins cp310 wheel hashes, so a python base
      # bump without a lock regen breaks the image build (`--require-hashes`
      # can't install cp310 torch on 3.14 — Dependabot #164; note Dependabot
      # classes 3.10 → 3.14 as *minor*). The py3.14 move happens deliberately
      # as base + lock regen + CLAP smoke in one PR. Patch updates of the
      # current base stay allowed.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: docker
    directory: "/services/tidal-downloader"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/services/ytmusic-streamer"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # --- github-actions: pinned `uses:` across every workflow ---------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
