name: Quality Visibility

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - develop
      - "feature/**"
  workflow_dispatch:

concurrency:
  group: quality-visibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests-coverage:
    name: Backend Tests + Coverage
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.CI_NON_BLOCKING_TEST_VISIBILITY != 'false' }}
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Prisma 7 no longer auto-generates the client on install
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run backend tests with coverage
        working-directory: backend
        env:
          BACKEND_COVERAGE_MAX_WORKERS: ${{ vars.BACKEND_COVERAGE_MAX_WORKERS || '2' }}
        run: npm run test:coverage -- --maxWorkers=${BACKEND_COVERAGE_MAX_WORKERS}

      - name: Build backend coverage summary
        run: node scripts/ci/backend-coverage-summary.mjs
        env:
          ENFORCE_COVERAGE_GATE: ${{ vars.CI_ENFORCE_TEST_GATE || 'false' }}
          COVERAGE_LINE_MIN: ${{ vars.COVERAGE_LINE_MIN || '0' }}
          COVERAGE_BRANCH_MIN: ${{ vars.COVERAGE_BRANCH_MIN || '0' }}
          COVERAGE_FUNCTION_MIN: ${{ vars.COVERAGE_FUNCTION_MIN || '0' }}
          COVERAGE_STATEMENT_MIN: ${{ vars.COVERAGE_STATEMENT_MIN || '0' }}

      - name: Publish backend summary to workflow view
        if: always()
        run: |
          if [ -f backend/coverage/coverage-summary.md ]; then
            cat backend/coverage/coverage-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Backend Coverage Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage summary file was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload backend coverage artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-${{ github.run_id }}
          path: |
            backend/coverage/
          if-no-files-found: warn

  backend-postgres-integration:
    name: Backend PostgreSQL Integration
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.CI_NON_BLOCKING_TEST_VISIBILITY != 'false' }}
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm
      INTEGRATION_DATABASE_URL: postgresql://soundspan:soundspan@127.0.0.1:5432/soundspan
    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_USER: soundspan
          POSTGRES_PASSWORD: soundspan
          POSTGRES_DB: soundspan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soundspan -d soundspan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Typecheck PostgreSQL integration suite
        working-directory: backend
        run: npm run pretest:integration && npx tsc --noEmit -p tsconfig.integration.json

      - name: Run PostgreSQL integration tests
        working-directory: backend
        run: npm run test:integration

  frontend-quality-visibility:
    name: Frontend Quality Visibility
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.CI_NON_BLOCKING_TEST_VISIBILITY != 'false' }}
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

      - name: Run frontend targeted unit coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Run frontend component tests
        working-directory: frontend
        run: npm run test:component

      - name: Build frontend quality summary
        run: |
          E2E_TEST_COUNT=$(rg --files frontend/tests/e2e 2>/dev/null | rg -c '\.(spec|test)\.(ts|tsx)$' || true)
          if [ -z "$E2E_TEST_COUNT" ]; then
            E2E_TEST_COUNT=0
          fi
          SRC_FILE_COUNT=$(rg --files frontend/app frontend/components frontend/features frontend/hooks frontend/lib frontend/utils 2>/dev/null | wc -l | tr -d ' ')
          {
            echo "## Frontend Quality Visibility"
            echo ""
            echo "| Signal | Value |"
            echo "| --- | ---: |"
            echo "| Lint | ✅ Passed |"
            echo "| Build | ✅ Passed |"
            echo "| Unit Coverage (targeted social/history modules) | ✅ Passed (100% lines/branches/functions) |"
            echo "| E2E Spec Files Discovered | ${E2E_TEST_COUNT} |"
            echo "| Frontend Source Files (app/components/features/hooks/lib/utils) | ${SRC_FILE_COUNT} |"
          } > frontend-quality-summary.md

      - name: Publish frontend summary to workflow view
        if: always()
        run: |
          if [ -f frontend-quality-summary.md ]; then
            cat frontend-quality-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Frontend Quality Visibility" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Frontend summary file was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload frontend quality artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-quality-${{ github.run_id }}
          path: |
            frontend-quality-summary.md
          if-no-files-found: warn

  python-sidecar-tests:
    name: Python Sidecar Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.CI_NON_BLOCKING_TEST_VISIBILITY != 'false' }}
    strategy:
      fail-fast: false
      # Runtime/lock targets are tidal+ytmusic 3.14, DCLAP 3.12, and audio-analyzer 3.11.
      # The analyzer stays on 3.11 because TensorFlow 2.15.x has no CPython 3.12+
      # wheels; its dependency-light test job remains on 3.12.
      matrix:
        include:
          - service: tidal-downloader
            python-version: "3.14"
          - service: ytmusic-streamer
            python-version: "3.14"
          - service: audio-analyzer
            python-version: "3.12"
          - service: vibe-provider-dclap
            python-version: "3.12"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r services/${{ matrix.service }}/requirements-test.txt

      - name: Run sidecar tests
        run: pytest services/${{ matrix.service }}/tests -q

  python-quality:
    name: Python Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # tiddl requires Python >=3.13; mypy retains Python 3.11 semantics via pyproject.toml.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            services/requirements-quality.txt
            services/audio-analyzer/requirements-test.txt
            services/vibe-provider-dclap/requirements-test.txt
            services/tidal-downloader/requirements-test.txt
            services/ytmusic-streamer/requirements-test.txt

      - name: Install quality and sidecar test dependencies
        run: |
          pip install \
            -r services/requirements-quality.txt \
            -r services/audio-analyzer/requirements-test.txt \
            -r services/vibe-provider-dclap/requirements-test.txt \
            -r services/tidal-downloader/requirements-test.txt \
            -r services/ytmusic-streamer/requirements-test.txt

      - name: Run AIO image hardening tests
        run: pytest tests/ -q

      - name: Ruff lint
        run: ruff check services/

      - name: Ruff format check
        run: ruff format --check services/

      - name: Mypy shared services
        run: mypy

      - name: Mypy TIDAL downloader
        run: MYPYPATH=services mypy services/tidal-downloader/app.py services/tidal-downloader/tests

      - name: Mypy YouTube Music streamer
        run: MYPYPATH=services mypy services/ytmusic-streamer/app.py services/ytmusic-streamer/yt_download.py services/ytmusic-streamer/ytmusic_auth.py services/ytmusic-streamer/ytmusic_browse.py services/ytmusic-streamer/ytmusic_client.py services/ytmusic-streamer/ytmusic_downloads.py services/ytmusic-streamer/ytmusic_library.py services/ytmusic-streamer/ytmusic_lifecycle.py services/ytmusic-streamer/ytmusic_models.py services/ytmusic-streamer/ytmusic_runtime.py services/ytmusic-streamer/ytmusic_search.py services/ytmusic-streamer/ytmusic_stream.py services/ytmusic-streamer/tests

      - name: Mypy audio analyzer
        run: MYPYPATH=services mypy services/audio-analyzer/analyzer.py

      - name: Mypy DCLAP provider
        run: MYPYPATH=services mypy services/vibe-provider-dclap/__main__.py services/vibe-provider-dclap/http_server.py services/vibe-provider-dclap/inference.py services/vibe-provider-dclap/model_provider.py services/vibe-provider-dclap/music_path.py services/vibe-provider-dclap/preprocessing.py services/vibe-provider-dclap/settings.py

  enforcement-gates:
    name: Enforcement Gates
    runs-on: ubuntu-latest
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            packages/media-metadata-contract/package-lock.json

      - name: Check route error canonicalization
        run: node scripts/ci/check-route-error-canon.mjs

      - name: Test route error canonicalization gate
        run: npm run check:error-canon:test

      - name: Check source file sizes
        run: node scripts/ci/check-file-size.mjs

      - name: Test source file-size gate
        run: npm run check:file-size:test

      - name: Check npm override staleness
        run: npm run check:override-staleness

      - name: Test npm override staleness gate
        run: npm run check:override-staleness:test

      - name: Check Dockerfile hygiene
        run: node --test scripts/ci/dockerfile-hygiene.test.mjs

      - name: Check frontend hardcoded hex baseline
        run: npm --prefix frontend run lint:hex

      - name: Install and build media metadata contract
        working-directory: packages/media-metadata-contract
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Prisma 7 no longer auto-generates the client on install
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Check OpenAPI route sync
        run: npm --prefix backend test -- --maxWorkers=2 src/config/__tests__/openapiRouteSync.test.ts

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Check repository formatting
        run: npm run format:check

  backend-typecheck:
    name: Backend Typecheck
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.CI_NON_BLOCKING_TEST_VISIBILITY != 'false' }}
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Build media-metadata-contract package
        working-directory: packages/media-metadata-contract
        run: |
          npm ci
          npm run build

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      # Prisma 7 no longer auto-generates the client on install
      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Run backend typecheck
        working-directory: backend
        run: ./node_modules/.bin/tsc --noEmit

  frontend-typecheck:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.CI_NON_BLOCKING_TEST_VISIBILITY != 'false' }}
    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.npm
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build media-metadata-contract package types
        working-directory: frontend
        run: npx tsc -p ../packages/media-metadata-contract/tsconfig.json

      - name: Run frontend typecheck
        working-directory: frontend
        run: npm run typecheck

  helm-chart-visibility:
    name: Helm Chart Visibility
    runs-on: ubuntu-latest
    continue-on-error: ${{ vars.CI_NON_BLOCKING_TEST_VISIBILITY != 'false' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Run chart lint + render assertions
        run: ./scripts/helm-chart-render-check.sh

      - name: Publish helm summary to workflow view
        if: always()
        run: |
          {
            echo "## Helm Chart Visibility"
            echo ""
            echo "| Signal | Value |"
            echo "| --- | ---: |"
            echo "| helm lint | ✅ Passed |"
            echo "| template render assertions (AIO + Individual HA + global.env) | ✅ Passed |"
            echo ""
            echo "Script: \`scripts/helm-chart-render-check.sh\`"
          } >> "$GITHUB_STEP_SUMMARY"
