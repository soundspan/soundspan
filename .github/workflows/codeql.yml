name: CodeQL

# Static analysis via GitHub's default-setup-style CodeQL (docs/modernization-
# roadmap.md F45, epic #10, #59 WS2.4). Analysis is a blocking pull-request
# and main-branch check, with alerts surfaced in the Security tab.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main] # immediate post-merge analysis, aligned with security-scanning.yml
  schedule:
    - cron: "30 6 * * 1" # Monday 06:30 UTC, offset from security-scanning.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript (not separate javascript/typescript entries)
        # covers both frontend and backend; python covers the 4 sidecars.
        # Helm/bash are out of CodeQL's scope.
        language: [javascript-typescript, python]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:${{ matrix.language }}"
