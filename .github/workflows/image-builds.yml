name: Image Builds

on:
    push:
        branches: [main, "feature/**", "feat/**"]
    release:
        types: [published]
    workflow_dispatch:

jobs:
    validate-release-tag:
        name: Validate release tag
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            release_tag: ${{ steps.release-meta.outputs.release_tag }}
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"

            - name: Validate release metadata
              id: release-meta
              run: |
                  if [ "${GITHUB_EVENT_NAME}" != "release" ]; then
                    echo "release_tag=" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  RELEASE_TAG="${{ github.event.release.tag_name }}"
                  ./scripts/release/validate-release-version.sh "${RELEASE_TAG}"

                  if ! node scripts/release/version-sync.mjs --check --version "${RELEASE_TAG}"; then
                    echo "Release metadata must match release tag (${RELEASE_TAG})." >&2
                    exit 1
                  fi

                  echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

    build-images:
        name: ${{ matrix.job_name }}
        runs-on: ${{ matrix.runs_on }}
        timeout-minutes: 60
        needs: [validate-release-tag]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - id: aio
                      job_name: Build & Push AIO Image
                      runs_on: self-hosted
                      image_name: ""
                      image_repo_mode: root
                      context: .
                      file: ./Dockerfile
                      target: ""
                      build_contexts: ""
                      include_hf_token: true
                      needs_node: true
                      include_frontend_build_args: true
                      cache_scope: aio
                      smoke_import: ""
                      smoke_user: ""
                    - id: backend
                      job_name: Build & Push Backend Image
                      runs_on: ubuntu-latest
                      image_name: backend
                      image_repo_mode: suffixed
                      context: ./backend
                      file: ./backend/Dockerfile
                      target: api-runtime
                      build_contexts: media-metadata-contract=./packages/media-metadata-contract
                      include_hf_token: false
                      needs_node: false
                      include_frontend_build_args: false
                      cache_scope: backend
                      smoke_import: ""
                      smoke_user: ""
                    - id: backend-worker
                      job_name: Build & Push Backend Worker Image
                      runs_on: ubuntu-latest
                      image_name: backend-worker
                      image_repo_mode: suffixed
                      context: ./backend
                      file: ./backend/Dockerfile
                      target: worker-runtime
                      build_contexts: media-metadata-contract=./packages/media-metadata-contract
                      include_hf_token: false
                      needs_node: false
                      include_frontend_build_args: false
                      cache_scope: backend-worker
                      smoke_import: ""
                      smoke_user: ""
                    - id: frontend
                      job_name: Build & Push Frontend Image
                      runs_on: ubuntu-latest
                      image_name: frontend
                      image_repo_mode: suffixed
                      context: ./frontend
                      file: ./frontend/Dockerfile
                      target: ""
                      build_contexts: media-metadata-contract=./packages/media-metadata-contract
                      include_hf_token: false
                      needs_node: true
                      include_frontend_build_args: true
                      cache_scope: frontend
                      smoke_import: ""
                      smoke_user: ""
                    - id: audio-analyzer
                      job_name: Build & Push Audio Analyzer Image
                      runs_on: ubuntu-latest
                      image_name: audio-analyzer
                      image_repo_mode: suffixed
                      context: .
                      file: ./services/audio-analyzer/Dockerfile
                      target: ""
                      build_contexts: ""
                      include_hf_token: true
                      needs_node: false
                      include_frontend_build_args: false
                      cache_scope: audio-analyzer
                      smoke_import: import analyzer
                      smoke_user: ""
                    - id: vibe-provider-dclap
                      job_name: Build & Push DCLAP Provider Image
                      runs_on: self-hosted
                      image_name: vibe-provider-dclap
                      image_repo_mode: suffixed
                      context: .
                      file: ./services/vibe-provider-dclap/Dockerfile
                      target: ""
                      build_contexts: ""
                      include_hf_token: false
                      needs_node: false
                      include_frontend_build_args: false
                      cache_scope: vibe-provider-dclap
                      # Import the actual entrypoint file; its __main__ guard prevents the server from starting.
                      smoke_import: import importlib.util as u; s = u.spec_from_file_location('smoke_entry', '/app/__main__.py'); m = u.module_from_spec(s); s.loader.exec_module(m)
                      smoke_user: ""
                    - id: tidal-streamer
                      job_name: Build & Push TIDAL Streamer Image
                      runs_on: ubuntu-latest
                      image_name: tidal-streamer
                      # Rename back-compat: keep publishing identical tags under the old image name.
                      alias_image_name: tidal-downloader
                      image_repo_mode: suffixed
                      context: .
                      file: ./services/tidal-streamer/Dockerfile
                      target: ""
                      build_contexts: ""
                      include_hf_token: false
                      needs_node: false
                      include_frontend_build_args: false
                      cache_scope: tidal-streamer
                      smoke_import: import app
                      smoke_user: ""
                    - id: ytmusic-streamer
                      job_name: Build & Push YTMusic Streamer Image
                      runs_on: ubuntu-latest
                      image_name: ytmusic-streamer
                      image_repo_mode: suffixed
                      context: .
                      file: ./services/ytmusic-streamer/Dockerfile
                      target: ""
                      build_contexts: ""
                      include_hf_token: false
                      needs_node: false
                      include_frontend_build_args: false
                      cache_scope: ytmusic-streamer
                      smoke_import: import app
                      smoke_user: ytmusic
        permissions:
            contents: read
            packages: write
        steps:
            - id: lower-repo
              name: Job env setup (repo name + isolated docker config)
              run: |
                  # Several self-hosted runners share one physical box (and
                  # one Docker daemon). A per-job docker config isolates
                  # buildx builder state so no docker/buildx command in this
                  # job can see — let alone remove — a concurrent job's
                  # builder. (Without this, one job's cleanup stopped a
                  # neighbor's in-flight buildkitd: "graceful_stop" build
                  # failures.) Note: the `runner` context is unavailable in
                  # job-level env, so this exports via GITHUB_ENV for all
                  # subsequent steps.
                  mkdir -p "${RUNNER_TEMP}/docker-config"
                  echo "DOCKER_CONFIG=${RUNNER_TEMP}/docker-config" >> "$GITHUB_ENV"
                  echo "GHCR_REPO=ghcr.io/${GITHUB_REPOSITORY@L}" >> "$GITHUB_ENV"

            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Node.js
              if: ${{ matrix.needs_node }}
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"

            # runner.environment is the supported runner-type property.
            - name: Self-hosted pre-build cleanup (neighbor-safe)
              if: ${{ runner.environment == 'self-hosted' }}
              run: |
                  set -euo pipefail
                  # The daemon is shared with concurrently running jobs, so
                  # only provably neighbor-safe operations belong here. No
                  # global `docker buildx prune` / `docker builder prune`:
                  # those race concurrent builds on the shared daemon.
                  # Daemon-wide disk hygiene belongs in a host cron.

                  # Remove stale dangling images older than a week (untagged
                  # only; layers in use by running builds are never dangling).
                  docker image prune --force --filter "until=168h" || true

                  # Remove exited buildx/buildkit containers left from
                  # interrupted runs (status=exited cannot match a
                  # neighbor's live builder).
                  docker ps -a --filter "name=buildx_buildkit" --filter "status=exited" -q | xargs -r docker rm -v || true

            - name: Set up Buildx
              id: buildx
              uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
              with:
                  cleanup: true

            - name: Login to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Get short SHA
              id: sha
              run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

            - name: Determine image tags
              id: tag-config
              run: |
                  IMAGE_REPO="${GHCR_REPO}"
                  if [ "${{ matrix.image_repo_mode }}" = "suffixed" ]; then
                    IMAGE_REPO="${GHCR_REPO}-${{ matrix.image_name }}"
                  fi
                  echo "image_repo=${IMAGE_REPO}" >> "$GITHUB_OUTPUT"

                  ALIAS_IMAGE_NAME="${{ matrix.alias_image_name || '' }}"
                  ALIAS_IMAGE_REPO=""
                  if [ -n "${ALIAS_IMAGE_NAME}" ]; then
                    ALIAS_IMAGE_REPO="${GHCR_REPO}-${ALIAS_IMAGE_NAME}"
                  fi

                  emit_tag() {
                    local tag="$1"
                    echo "${IMAGE_REPO}:${tag}"
                    if [ -n "${ALIAS_IMAGE_REPO}" ]; then
                      echo "${ALIAS_IMAGE_REPO}:${tag}"
                    fi
                  }

                  if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
                    RELEASE_TAG="${{ needs.validate-release-tag.outputs.release_tag }}"
                    if [ -z "${RELEASE_TAG}" ]; then
                      echo "Release tag is missing." >&2
                      exit 1
                    fi

                    if [ "${{ matrix.include_frontend_build_args }}" = "true" ]; then
                      echo "frontend_build_type=release" >> "$GITHUB_OUTPUT"
                      echo "frontend_app_version=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
                    fi

                    echo "version_label=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
                    if [[ "${RELEASE_TAG}" == *-* ]]; then
                      {
                        echo "tags<<EOF"
                        emit_tag "${RELEASE_TAG}"
                        echo "EOF"
                      } >> "$GITHUB_OUTPUT"
                    else
                      {
                        echo "tags<<EOF"
                        emit_tag "latest"
                        emit_tag "${RELEASE_TAG}"
                        echo "EOF"
                      } >> "$GITHUB_OUTPUT"
                    fi
                  else
                    if [ "${GITHUB_REF_NAME}" = "main" ]; then
                      CHANNEL="main"
                    else
                      CHANNEL="develop"
                    fi

                    echo "version_label=${CHANNEL}-${{ steps.sha.outputs.short }}" >> "$GITHUB_OUTPUT"
                    if [ "${{ matrix.include_frontend_build_args }}" = "true" ]; then
                      echo "frontend_build_type=nightly" >> "$GITHUB_OUTPUT"
                      echo "frontend_app_version=" >> "$GITHUB_OUTPUT"
                    fi
                    {
                      echo "tags<<EOF"
                      emit_tag "${CHANNEL}"
                      emit_tag "${CHANNEL}-${{ steps.sha.outputs.short }}"
                      echo "EOF"
                    } >> "$GITHUB_OUTPUT"
                  fi

            - name: Prepare optional build inputs
              id: build-inputs
              run: |
                  {
                    echo "build_args<<EOF"
                    if [ "${{ matrix.include_frontend_build_args }}" = "true" ]; then
                      echo "NEXT_PUBLIC_BUILD_TYPE=${{ steps.tag-config.outputs.frontend_build_type }}"
                      echo "NEXT_PUBLIC_APP_VERSION=${{ steps.tag-config.outputs.frontend_app_version }}"
                    fi
                    echo "EOF"
                  } >> "$GITHUB_OUTPUT"

            # Load sidecars locally first so their container-layout imports gate
            # GHCR publication while the exported cache stays warm for future builds.
            - name: Build image for smoke test
              if: ${{ matrix.smoke_import != '' }}
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.file }}
                  build-contexts: ${{ matrix.build_contexts }}
                  push: false
                  load: true
                  build-args: ${{ steps.build-inputs.outputs.build_args }}
                  # Pass HF_TOKEN straight from the secrets context to the build-secret
                  # mount; never transit GITHUB_OUTPUT/step outputs. False legs mount no
                  # secret; an unset token mounts empty exactly as before.
                  secrets: ${{ matrix.include_hf_token && format('hf_token={0}', secrets.HF_TOKEN) || '' }}
                  tags: soundspan-smoke-${{ matrix.id }}:${{ github.run_id }}
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ steps.tag-config.outputs.version_label }}
                  cache-from: type=gha,scope=${{ matrix.cache_scope }}
                  # ignore-error: a cache-write failure must not fail a leg whose image built successfully.
                  cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }},ignore-error=true
                  # ARM64 disabled due to QEMU emulation issues with npm packages
                  platforms: linux/amd64

            - name: Container-layout import smoke test (${{ matrix.id }})
              if: ${{ matrix.smoke_import != '' }}
              run: |
                  PYTHON_BINARY=python
                  SMOKE_USER="${{ matrix.smoke_user }}"
                  USER_ARGS=()
                  if [ "${{ matrix.id }}" = "audio-analyzer" ]; then
                    PYTHON_BINARY=python3
                  fi
                  if [ -n "${SMOKE_USER}" ]; then
                    USER_ARGS=(--user "${SMOKE_USER}")
                  fi

                  if ! docker run --rm \
                    "${USER_ARGS[@]}" \
                    --entrypoint "${PYTHON_BINARY}" \
                    "soundspan-smoke-${{ matrix.id }}:${{ github.run_id }}" \
                    -c "${{ matrix.smoke_import }}"; then
                    echo "Container-layout import smoke test failed for ${{ matrix.id }}." >&2
                    exit 1
                  fi

            # Commit-pinned and release-version tags are unique to this job, so they
            # are byte-exact copies of the smoke-tested image. Mutable channel tags
            # are already last-writer-wins at the registry; a shared-daemon race can
            # only substitute another smoke-verified image for the same channel and
            # converges to the same registry state. Thus every commit-pinned/version
            # tag is byte-exact, while each channel tag points to a smoke-tested image.
            # Accepted trade-off: plain docker push emits no buildx provenance
            # attestation for these four sidecar images.
            - name: Promote smoke-tested image
              if: ${{ matrix.smoke_import != '' }}
              run: |
                  set -euo pipefail
                  SMOKE_IMAGE="soundspan-smoke-${{ matrix.id }}:${{ github.run_id }}"
                  while IFS= read -r tag; do
                    if [ -z "${tag}" ]; then
                      continue
                    fi
                    docker tag "${SMOKE_IMAGE}" "${tag}"
                    docker push "${tag}"
                  done <<'EOF'
                  ${{ steps.tag-config.outputs.tags }}
                  EOF

            - name: Build and push image (with target)
              if: ${{ matrix.target != '' }}
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.file }}
                  build-contexts: ${{ matrix.build_contexts }}
                  target: ${{ matrix.target }}
                  push: true
                  build-args: ${{ steps.build-inputs.outputs.build_args }}
                  # Pass HF_TOKEN straight from the secrets context to the build-secret
                  # mount; never transit GITHUB_OUTPUT/step outputs. False legs mount no
                  # secret; an unset token mounts empty exactly as before.
                  secrets: ${{ matrix.include_hf_token && format('hf_token={0}', secrets.HF_TOKEN) || '' }}
                  tags: ${{ steps.tag-config.outputs.tags }}
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ steps.tag-config.outputs.version_label }}
                  cache-from: type=gha,scope=${{ matrix.cache_scope }}
                  # ignore-error: a cache-write failure must not fail a leg whose image already pushed (#66).
                  cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }},ignore-error=true
                  # ARM64 disabled due to QEMU emulation issues with npm packages
                  platforms: linux/amd64

            - name: Build and push image
              if: ${{ matrix.target == '' && matrix.smoke_import == '' }}
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
              with:
                  context: ${{ matrix.context }}
                  file: ${{ matrix.file }}
                  build-contexts: ${{ matrix.build_contexts }}
                  push: true
                  build-args: ${{ steps.build-inputs.outputs.build_args }}
                  # Pass HF_TOKEN straight from the secrets context to the build-secret
                  # mount; never transit GITHUB_OUTPUT/step outputs. False legs mount no
                  # secret; an unset token mounts empty exactly as before.
                  secrets: ${{ matrix.include_hf_token && format('hf_token={0}', secrets.HF_TOKEN) || '' }}
                  tags: ${{ steps.tag-config.outputs.tags }}
                  labels: |
                      org.opencontainers.image.revision=${{ github.sha }}
                      org.opencontainers.image.version=${{ steps.tag-config.outputs.version_label }}
                  cache-from: type=gha,scope=${{ matrix.cache_scope }}
                  # ignore-error: a cache-write failure must not fail a leg whose image already pushed (#66).
                  cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }},ignore-error=true
                  # ARM64 disabled due to QEMU emulation issues with npm packages
                  platforms: linux/amd64

            - name: Self-hosted post-build cleanup (neighbor-safe)
              if: ${{ always() && runner.environment == 'self-hosted' }}
              run: |
                  set -euo pipefail
                  BUILDER_NAME="${{ steps.buildx.outputs.name }}"
                  echo "Container disk usage before cleanup:"
                  docker system df || true

                  # Remove ONLY this job's ephemeral Buildx builder (its
                  # build cache dies with it; persistent layer cache lives
                  # in the GHA cache backend). The per-job DOCKER_CONFIG
                  # guarantees this name can only resolve to our builder.
                  if [ -n "${BUILDER_NAME}" ]; then
                      docker buildx rm --force "${BUILDER_NAME}" >/dev/null 2>&1 || true
                  fi

                  if [ -n "${{ matrix.smoke_import }}" ]; then
                    while IFS= read -r tag; do
                      if [ -z "${tag}" ]; then
                        continue
                      fi
                      # Removing a tag only unrefs its name; after this job's last local
                      # name is gone, the image is prunable. A concurrent job may have
                      # re-pointed main/develop/latest; removing that name after its push
                      # completes is safe because pushes read the name at push time and
                      # each job re-tags immediately before pushing.
                      docker rmi -f "${tag}" || true
                    done <<'EOF'
                  ${{ steps.tag-config.outputs.tags }}
                  EOF
                    docker rmi -f "soundspan-smoke-${{ matrix.id }}:${{ github.run_id }}" || true
                  fi

                  # Neighbor-safe daemon hygiene only — see the pre-build
                  # step for the rationale. Global buildx/builder prunes
                  # were removed: they stopped concurrent jobs' builders
                  # mid-build on the shared daemon ("graceful_stop").
                  docker image prune --force --filter "until=168h" || true
                  docker ps -a --filter "name=buildx_buildkit" --filter "status=exited" -q | xargs -r docker rm -v || true

                  echo "Container disk usage after cleanup:"
                  docker system df || true

            - name: GitHub-hosted smoke image cleanup
              if: ${{ always() && matrix.smoke_import != '' && runner.environment != 'self-hosted' }}
              run: |
                  while IFS= read -r tag; do
                    if [ -z "${tag}" ]; then
                      continue
                    fi
                    # Removing a tag only unrefs its name; after this job's last local
                    # name is gone, the image is prunable. A concurrent job may have
                    # re-pointed main/develop/latest; removing that name after its push
                    # completes is safe because pushes read the name at push time and
                    # each job re-tags immediately before pushing.
                    docker rmi -f "${tag}" || true
                  done <<'EOF'
                  ${{ steps.tag-config.outputs.tags }}
                  EOF
                  docker rmi -f "soundspan-smoke-${{ matrix.id }}:${{ github.run_id }}" || true
