name: Dependency Review

# Flags newly-introduced vulnerable / license-incompatible dependencies on
# PRs (docs/modernization-roadmap.md F45, epic #10, #59 WS2.4). Free for
# public repos (no GHAS license needed).
# Prerequisite: the repo's Dependency graph must be enabled (Settings -> Security; admin-only) or this fails with "Dependency review is not supported on this repository".
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately kept non-blocking. After blocking gitleaks is stable for about
    # a week, the OWNER should remove continue-on-error and add fail-on-severity:
    # high under with:; Trivy in security-scanning.yml follows.
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
