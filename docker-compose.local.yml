# Local host-run testing dependencies for npm/tsx workflows.
#
# Purpose:
# - Start only infra needed for running backend/frontend directly on host.
# - Do NOT run frontend/backend containers from this file.
# - Avoid common local port collisions via +1 host mappings.
#
# Typical usage:
#   docker compose -f docker-compose.local.yml up -d postgres-local redis-local
#   cd backend && npm run dev
#   cd frontend && PORT=3031 BACKEND_URL=http://127.0.0.1:3007 npm run dev
#
# Optional analyzer (heavier):
#   (starts the MusicCNN analyzer)
#   docker compose -f docker-compose.local.yml --profile audio-analysis up -d
#
# Host port map:
#   postgres 5433 -> 5432
#   redis    6380 -> 6379

services:
    postgres-local:
        image: pgvector/pgvector:pg16
        environment:
            POSTGRES_USER: soundspan
            POSTGRES_PASSWORD: soundspan
            POSTGRES_DB: soundspan
        volumes:
            - postgres_local_data:/var/lib/postgresql/data
        ports:
            - "5433:5432"
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U soundspan -d soundspan"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis-local:
        image: redis:7-alpine
        ports:
            - "6380:6379"
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    # Audio Analyzer - Essentia with ML models for Enhanced vibe matching
    audio-analyzer-local:
        profiles: ["audio-analysis"]
        build:
            context: .
            dockerfile: services/audio-analyzer/Dockerfile
        environment:
            # Connect to host machine's services (or Docker services)
            REDIS_URL: redis://redis-local:6379
            DATABASE_URL: postgresql://soundspan:soundspan@postgres-local:5432/soundspan
            # Music path inside container (mounted from host)
            MUSIC_PATH: /music
            BATCH_SIZE: 10
            SLEEP_INTERVAL: 5
            BRPOP_TIMEOUT: 10
            AUDIO_REDIS_SOCKET_TIMEOUT: ${AUDIO_REDIS_SOCKET_TIMEOUT:-15}
            MODEL_IDLE_TIMEOUT: 60
        volumes:
            # Host music path; override MUSIC_PATH in your shell/.env as needed.
            - "${MUSIC_PATH:-./music}:/music:ro"
        depends_on:
            postgres-local:
                condition: service_healthy
            redis-local:
                condition: service_healthy
        restart: unless-stopped

    # DCLAP HTTP provider - standalone provider for local testing.
    vibe-provider-dclap-local:
        profiles: ["vibe-provider-dclap"]
        build:
            context: .
            dockerfile: services/vibe-provider-dclap/Dockerfile
        environment:
            MUSIC_PATH: /music
            MODEL_IDLE_TIMEOUT: ${DCLAP_MODEL_IDLE_TIMEOUT:-300}
            DCLAP_ONNX_INTRA_OP_THREADS: ${DCLAP_ONNX_INTRA_OP_THREADS:-1}
            DCLAP_HTTP_PORT: ${DCLAP_HTTP_PORT:-8092}
            DCLAP_IMAGE_VERSION: ${VERSION:-local}
            # The provider fails closed: with this unset (or left at the
            # published default) every non-/health request returns 403.
            # Export the value from backend/.env before starting this profile.
            INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
        volumes:
            - "${MUSIC_PATH:-./music}:/music:ro"
        restart: unless-stopped

volumes:
    postgres_local_data:
