# Gitleaks config for soundspan (docs/modernization-roadmap.md F45, epic
# #10, #59 WS2.4).
#
# Extends gitleaks' built-in default ruleset; only adds allowlist entries
# for confirmed false positives / synthetic test fixtures, each with a
# one-line rationale. Never add an entry for a plausibly-real secret --
# rotate it and scrub it from history instead of allowlisting it.

title = "soundspan gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Confirmed false positives / synthetic test fixtures, triaged 2026-07-10 (cycle 2 / packet E) from a full-history scan of the main checkout."
regexes = [
  # backend/src/middleware/__tests__/subsonicAuth.test.ts -- synthetic
  # ssap_ app-password fixtures for the OpenSubsonic auth tests: a literal
  # alphabet run and two self-describing phrases. The ssap_ prefix marks
  # soundspan app passwords, so the generic-api-key rule fires, but none of
  # these are real credentials. Hit at commits eb3a4a8a and later revisions
  # of the same test file.
  '''ssap_0123456789abcdefghijklmnopqrstuv''',
  '''ssap_this-is-a-real-local-password''',
  '''ssap_credential-beyond-position-twenty''',

  # backend/src/utils/__tests__/apiKeyHash.test.ts:123 -- a named, obviously
  # non-real legacy-pepper value used to test the encryption-key compat
  # alias path ("compat-alias-pepper" is literally what it says it is).
  # Hit at 2 commits (fe5f5858, 600f632e) touching the same line.
  '''compat-alias-pepper-1234567890''',

  # backend/src/utils/__tests__/timingSafe.test.ts:35-36 -- synthetic
  # "a1b2c3d4..." placeholder hex strings used to test constant-time string
  # comparison; not real key material. Hit at commit ab0bfc44 (2 lines).
  '''a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4''',

  # Dockerfile + services/vibe-provider-dclap/Dockerfile -- pinned SHA-256
  # content digests of the six PUBLIC laion/clap-htsat-unfused tokenizer
  # files both images verify after download (supply-chain integrity, not
  # credentials). 64-hex assignments trip generic-api-key.
  '''9efb9557bc804f2ca6e394486af2e45dfed0b18554909735a99c6220b84e4288''',
  '''fe36cab26d4f4421ed725e10a2e9ddb7f799449c603a96e7f29b5a3c82a95862''',
  '''06e405a36dfe4b9604f484f6a1e619af1a7f7d09e34a8555eb0b77b66318067f''',
  '''4e105259baf1a26f1ed8b503ad09678d69d02b6be1c91faa55075a22d5bee148''',
  '''377f91458f7729a4574a84c77bdce67dbc3c58c1a345a29bbf8c4eb1307948a3''',
  '''ed19656ea1707df69134c4af35c8ceda2cc9860bf2c3495026153a133670ab5e''',

  # services/vibe-provider-dclap/Dockerfile -- TOKENIZER_REVISION is the
  # public immutable Hugging Face git commit of laion/clap-htsat-unfused
  # that the build vendors tokenizer files from. A 40-hex assignment trips
  # generic-api-key, but this exact value is a source-control revision,
  # not a credential (allowlist regexes match the captured secret).
  '''8fa0f1c6d0433df6e97c127f64b2a1d6c0dcda8a''',

  # CHANGELOG.md:59,65 -- prose ("...OAuth tokens, 2FA/Subsonic secrets...")
  # describing what the encryption-at-rest work covers. "2FA/Subsonic" is
  # two feature names joined by a slash, not a credential; gitleaks'
  # generic-api-key rule pattern-matches the slash-joined token shape.
  # Hit at 3 commits (d5dad958, b27eb406, 0888643a).
  '''2FA/Subsonic''',
  # backend/src/routes/__tests__/totpBehavior.test.ts:80 (const SECRET_B32)
  # Synthetic RFC 4648 base32 TOTP shared-secret fixture generated one-off with the removed
  # speakeasy library purely to pin speakeasy->otplib verification compatibility vectors in
  # tests. It protects nothing, was never enrolled anywhere, and cannot be rotated into
  # anything real. Hit by generic-api-key at commit e169772 in PR #234.
  '''HEYHKYLRO4TCQKL2JZIEA4BUIBITUJTBLVOXWOTEORWFI3SBKQ4Q''',
]
