# soundspan all-in-one (AIO) deployment.
#
# Use this when you want one container that bundles frontend+backend+db+redis.
# This is the simplest path for production-style single-host installs.
#
# Usage:
#   1. Set MUSIC_PATH and secrets in your .env
#   2. docker compose -f docker-compose.aio.yml up -d
#   3. Open http://localhost:3030
#
# Add optional acquisition/indexer tools with:
#   docker compose -f docker-compose.aio.yml -f docker-compose.services.yml up -d

services:
  soundspan:
    image: ${SOUNDSPAN_AIO_IMAGE:-ghcr.io/soundspan/soundspan}:${VERSION:-latest}
    container_name: ${SOUNDSPAN_AIO_CONTAINER_NAME:-soundspan}
    ports:
      - "${PORT:-3030}:3030"
    volumes:
      # REQUIRED: Path to your music library
      - ${MUSIC_PATH:-/path/to/your/music}:/music
      # Persistent data (database, cache, etc.)
      - soundspan_data:/data
    environment:
      - TZ=${TZ:-UTC}
      # AIO honors operator-supplied secrets; they take precedence and persist to /data/secrets.
      # Empty values generate and persist stable values on first boot.
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY:-}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-}
      # AIO uses fixed internal host/user/database components; its verified
      # credential helper URL-encodes this separately supplied password.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - BROWSE_IMAGE_CACHE_MAX_BYTES=${BROWSE_IMAGE_CACHE_MAX_BYTES:-268435456}
      - BROWSE_IMAGE_CACHE_MAX_ENTRIES=${BROWSE_IMAGE_CACHE_MAX_ENTRIES:-2048}
      # Runtime streaming-engine selector. Accepted: native | howler | videojs.
      # Leave unset to use the server's built-in default engine.
      - STREAMING_ENGINE_MODE=${STREAMING_ENGINE_MODE:-}
      # Preserve Redis streams/groups across restarts unless explicitly overridden
      - REDIS_FLUSH_ON_STARTUP=${REDIS_FLUSH_ON_STARTUP:-false}
      # Coarse feature flags for ML/recommendation subsystems (default: true)
      - AUDIO_ANALYSIS_ENABLED=${AUDIO_ANALYSIS_ENABLED:-true}
      - DISCOVERY_ENABLED=${DISCOVERY_ENABLED:-true}
      - AUTO_PLAYLISTS_ENABLED=${AUTO_PLAYLISTS_ENABLED:-true}
      - FEDERATION_ENABLED=${FEDERATION_ENABLED:-false}
      - FEDERATION_TOMBSTONE_RETENTION_DAYS=${FEDERATION_TOMBSTONE_RETENTION_DAYS:-90}
      - FEDERATION_SYNC_INTERVAL_MINUTES=${FEDERATION_SYNC_INTERVAL_MINUTES:-15}
      # MusicCNN queue socket timeout; runtime enforces at least BRPOP timeout + 5s
      - AUDIO_REDIS_SOCKET_TIMEOUT=${AUDIO_REDIS_SOCKET_TIMEOUT:-35}
      # CLAP queue socket timeout; runtime enforces at least poll interval + 5s
      - CLAP_REDIS_SOCKET_TIMEOUT=${CLAP_REDIS_SOCKET_TIMEOUT:-10}
      # Lidarr webhook callback URL - how Lidarr reaches soundspan when downloads complete
      # Default uses host.docker.internal which works on most setups with extra_hosts below
      # Override if using custom Docker networks: e.g., http://192.168.0.20:3030
      - SOUNDSPAN_CALLBACK_URL=${SOUNDSPAN_CALLBACK_URL:-http://host.docker.internal:3030}
    # Makes host.docker.internal work on Linux (already works on Docker Desktop)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  soundspan_data:
    name: ${SOUNDSPAN_AIO_DATA_VOLUME:-soundspan_data}
