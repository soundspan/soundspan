{{- if not .Values.secrets.existingSecret }}
{{- /*
  Stable secret generation (F22). A routine `helm upgrade` must never rotate
  SESSION_SECRET / SETTINGS_ENCRYPTION_KEY / INTERNAL_API_SECRET /
  POSTGRES_PASSWORD out from under a running install — doing so invalidates
  every JWT, makes all AES-encrypted settings (Lidarr/OAuth/2FA/Subsonic)
  undecryptable, and desyncs the Postgres password from an initialized data
  dir. `randAlphaNum` as a bare `default` re-rolls on every render, so reuse the
  value already stored in the live Secret instead.

  Per-key precedence: explicit `values.secrets.*` > value in the existing live
  Secret > freshly generated. `lookup` returns nil during `helm template` /
  `--dry-run` (no cluster), so first install and dry-run fall through to
  generation — which is correct (dry-run output is never applied).
*/}}
{{- $name := include "soundspan.fullname" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name) }}
{{- $existingData := (and $existing $existing.data) | default dict }}
{{- $sessionSecret := .Values.secrets.sessionSecret | default (get $existingData "SESSION_SECRET" | b64dec) | default (randAlphaNum 64) }}
{{- $settingsEncryptionKey := .Values.secrets.settingsEncryptionKey | default (get $existingData "SETTINGS_ENCRYPTION_KEY" | b64dec) | default (randAlphaNum 64) }}
{{- $internalApiSecret := .Values.secrets.internalApiSecret | default (get $existingData "INTERNAL_API_SECRET" | b64dec) | default (randAlphaNum 64) }}
{{- $postgresPassword := .Values.secrets.postgresPassword | default (get $existingData "POSTGRES_PASSWORD" | b64dec) | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "soundspan.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET: {{ $sessionSecret | quote }}
  SETTINGS_ENCRYPTION_KEY: {{ $settingsEncryptionKey | quote }}
  INTERNAL_API_SECRET: {{ $internalApiSecret | quote }}
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ $postgresPassword | quote }}
  POSTGRES_DB: {{ .Values.secrets.postgresDatabase | quote }}
  {{- if .Values.config.lidarrEnabled }}
  LIDARR_API_KEY: {{ .Values.config.lidarrApiKey | quote }}
  {{- end }}
  {{- if .Values.config.audiobookshelfUrl }}
  AUDIOBOOKSHELF_TOKEN: {{ .Values.config.audiobookshelfToken | quote }}
  {{- end }}
  {{- if .Values.config.lastfmApiKey }}
  LASTFM_API_KEY: {{ .Values.config.lastfmApiKey | quote }}
  {{- end }}
  {{- if .Values.config.fanartApiKey }}
  FANART_API_KEY: {{ .Values.config.fanartApiKey | quote }}
  {{- end }}
  {{- if .Values.config.openaiApiKey }}
  OPENAI_API_KEY: {{ .Values.config.openaiApiKey | quote }}
  {{- end }}
{{- end }}
