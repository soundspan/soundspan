{{- if eq .Values.deploymentMode "aio" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "soundspan.fullname" . }}
  labels:
    {{- include "soundspan.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "soundspan.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "soundspan.componentPodLabels" (dict "context" . "component" "aio") | nindent 8 }}
      {{- with .Values.global.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "soundspan.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.global.automountServiceAccountToken }}
      {{- if and .Values.aio.gpu.enabled .Values.aio.gpu.runtimeClassName }}
      runtimeClassName: {{ .Values.aio.gpu.runtimeClassName | quote }}
      {{- end }}
      # AIO container runs its own postgres/redis internally — needs writable FS
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: {{ .Values.aio.terminationGracePeriodSeconds | default 45 }}
      containers:
        - name: soundspan
          image: {{ include "soundspan.image" .Values.aio.image | quote }}
          imagePullPolicy: {{ .Values.aio.image.pullPolicy }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep {{ .Values.aio.lifecycle.preStopSleepSeconds | default 8 }}
          ports:
            - name: http
              containerPort: 3030
              protocol: TCP
            - name: backend-metrics
              containerPort: 3006
              protocol: TCP
          {{- $aioEnv := .Values.aio.env | default (dict) }}
          {{- $aioExplicitEnvKeys := dict
            "TZ" true
            "SESSION_SECRET" true
            "SETTINGS_ENCRYPTION_KEY" true
            "INTERNAL_API_SECRET" true
            "METRICS_TOKEN" true
            "METRICS_PUBLIC" true
            "LOCAL_LOGIN_ENABLED" true
            "OIDC_ENABLED" true
            "OIDC_ISSUER_URL" true
            "OIDC_CLIENT_ID" true
            "OIDC_CLIENT_SECRET" true
            "OIDC_REDIRECT_URI" true
            "OIDC_WEB_BASE_URL" true
            "OIDC_SCOPES" true
            "OIDC_AUTO_PROVISION" true
            "OIDC_MANAGE_ROLES" true
            "OIDC_GROUPS_CLAIM" true
            "OIDC_ADMIN_GROUP" true
            "OIDC_EMAIL_CLAIM" true
            "OIDC_NAME_CLAIM" true
            "OIDC_PROVIDER_NAME" true
            "POSTGRES_PASSWORD" true
            "ALLOWED_ORIGINS" true
            "LOG_LEVEL" true
            "DOCS_PUBLIC" true
            "AUDIO_ANALYSIS_ENABLED" true
            "DISCOVERY_ENABLED" true
            "AUTO_PLAYLISTS_ENABLED" true
            "FEATURE_REQUESTS" true
            "FEDERATION_ENABLED" true
            "SCAN_FILE_CONCURRENCY" true
            "CATALOG_PERSISTENCE" true
            "CATALOG_RETENTION_DAYS" true
            "FEDERATION_TOMBSTONE_RETENTION_DAYS" true
            "PROVIDER_TRACK_RETENTION_DAYS" true
            "FEDERATION_SYNC_INTERVAL_MINUTES" true
            "TIDAL_SIDECAR_URL" true
            "YTMUSIC_STREAMER_URL" true
            "LIDARR_ENABLED" true
            "LIDARR_URL" true
            "LIDARR_API_KEY" true
            "AUDIOBOOKSHELF_URL" true
            "AUDIOBOOKSHELF_TOKEN" true
            "LASTFM_API_KEY" true
            "LASTFM_SHARED_SECRET" true
            "FANART_API_KEY" true
            "OPENAI_API_KEY" true
            "ACOUSTID_API_KEY" true
          }}
          env:
            {{- if hasKey $aioEnv "TZ" }}
            - name: TZ
              value: {{ index $aioEnv "TZ" | quote }}
            {{- else }}
            - name: TZ
              value: {{ .Values.config.timezone | quote }}
            {{- end }}
            {{- if hasKey $aioEnv "SESSION_SECRET" }}
            - name: SESSION_SECRET
              value: {{ index $aioEnv "SESSION_SECRET" | quote }}
            {{- else }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "soundspan.secretName" . }}
                  key: SESSION_SECRET
            {{- end }}
            {{- if hasKey $aioEnv "SETTINGS_ENCRYPTION_KEY" }}
            - name: SETTINGS_ENCRYPTION_KEY
              value: {{ index $aioEnv "SETTINGS_ENCRYPTION_KEY" | quote }}
            {{- else }}
            - name: SETTINGS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "soundspan.secretName" . }}
                  key: SETTINGS_ENCRYPTION_KEY
            {{- end }}
            {{- if hasKey $aioEnv "INTERNAL_API_SECRET" }}
            - name: INTERNAL_API_SECRET
              value: {{ index $aioEnv "INTERNAL_API_SECRET" | quote }}
            {{- else }}
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "soundspan.secretName" . }}
                  key: INTERNAL_API_SECRET
            {{- end }}
            {{- if hasKey $aioEnv "METRICS_TOKEN" }}
            - name: METRICS_TOKEN
              value: {{ index $aioEnv "METRICS_TOKEN" | quote }}
            {{- else }}
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "soundspan.secretName" . }}
                  key: METRICS_TOKEN
                  optional: true
            {{- end }}
            {{- if hasKey $aioEnv "METRICS_PUBLIC" }}
            - name: METRICS_PUBLIC
              value: {{ index $aioEnv "METRICS_PUBLIC" | quote }}
            {{- else if .Values.metrics.public }}
            - name: METRICS_PUBLIC
              value: "true"
            {{- end }}
            {{- include "soundspan.oidcEnv" (dict "ctx" . "envMap" $aioEnv) | nindent 12 }}
            {{- if hasKey $aioEnv "POSTGRES_PASSWORD" }}
            - name: POSTGRES_PASSWORD
              value: {{ index $aioEnv "POSTGRES_PASSWORD" | quote }}
            {{- else }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "soundspan.secretName" . }}
                  key: POSTGRES_PASSWORD
                  {{- if .Values.secrets.existingSecret }}
                  optional: true
                  {{- end }}
            {{- end }}
            {{- if hasKey $aioEnv "ALLOWED_ORIGINS" }}
            - name: ALLOWED_ORIGINS
              value: {{ index $aioEnv "ALLOWED_ORIGINS" | quote }}
            {{- else if .Values.config.allowedOrigins }}
            - name: ALLOWED_ORIGINS
              value: {{ .Values.config.allowedOrigins | quote }}
            {{- end }}
            {{- if hasKey $aioEnv "LOG_LEVEL" }}
            - name: LOG_LEVEL
              value: {{ index $aioEnv "LOG_LEVEL" | quote }}
            {{- else if .Values.config.logLevel }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- end }}
            {{- if hasKey $aioEnv "DOCS_PUBLIC" }}
            - name: DOCS_PUBLIC
              value: {{ index $aioEnv "DOCS_PUBLIC" | quote }}
            {{- else if .Values.config.docsPublic }}
            - name: DOCS_PUBLIC
              value: "true"
            {{- end }}
            {{- if hasKey $aioEnv "FEDERATION_ENABLED" }}
            - name: FEDERATION_ENABLED
              value: {{ index $aioEnv "FEDERATION_ENABLED" | quote }}
            {{- else }}
            - name: FEDERATION_ENABLED
              value: {{ .Values.config.features.federation | quote }}
            {{- end }}
            {{- if hasKey $aioEnv "SCAN_FILE_CONCURRENCY" }}
            - name: SCAN_FILE_CONCURRENCY
              value: {{ index $aioEnv "SCAN_FILE_CONCURRENCY" | quote }}
            {{- else if not (kindIs "invalid" .Values.config.scanFileConcurrency) }}
            - name: SCAN_FILE_CONCURRENCY
              value: {{ .Values.config.scanFileConcurrency | quote }}
            {{- end }}
            {{- if hasKey $aioEnv "CATALOG_PERSISTENCE" }}
            - name: CATALOG_PERSISTENCE
              value: {{ index $aioEnv "CATALOG_PERSISTENCE" | quote }}
            {{- else if not (kindIs "invalid" .Values.config.catalogPersistence) }}
            - name: CATALOG_PERSISTENCE
              value: {{ .Values.config.catalogPersistence | quote }}
            {{- end }}
            {{- if hasKey $aioEnv "CATALOG_RETENTION_DAYS" }}
            - name: CATALOG_RETENTION_DAYS
              value: {{ index $aioEnv "CATALOG_RETENTION_DAYS" | quote }}
            {{- else if not (kindIs "invalid" .Values.config.catalogRetentionDays) }}
            - name: CATALOG_RETENTION_DAYS
              value: {{ .Values.config.catalogRetentionDays | quote }}
            {{- end }}
            {{- if hasKey $aioEnv "FEDERATION_TOMBSTONE_RETENTION_DAYS" }}
            - name: FEDERATION_TOMBSTONE_RETENTION_DAYS
              value: {{ index $aioEnv "FEDERATION_TOMBSTONE_RETENTION_DAYS" | quote }}
            {{- else }}
            - name: FEDERATION_TOMBSTONE_RETENTION_DAYS
              value: {{ .Values.config.federationTombstoneRetentionDays | quote }}
            {{- end }}
            {{- if hasKey $aioEnv "PROVIDER_TRACK_RETENTION_DAYS" }}
            - name: PROVIDER_TRACK_RETENTION_DAYS
              value: {{ index $aioEnv "PROVIDER_TRACK_RETENTION_DAYS" | quote }}
            {{- else }}
            - name: PROVIDER_TRACK_RETENTION_DAYS
              value: {{ .Values.config.providerTrackRetentionDays | quote }}
            {{- end }}
            {{- if hasKey $aioEnv "FEDERATION_SYNC_INTERVAL_MINUTES" }}
            - name: FEDERATION_SYNC_INTERVAL_MINUTES
              value: {{ index $aioEnv "FEDERATION_SYNC_INTERVAL_MINUTES" | quote }}
            {{- else }}
            - name: FEDERATION_SYNC_INTERVAL_MINUTES
              value: {{ .Values.config.federationSyncIntervalMinutes | quote }}
            {{- end }}
            {{- if hasKey $aioEnv "AUDIO_ANALYSIS_ENABLED" }}
            - name: AUDIO_ANALYSIS_ENABLED
              value: {{ index $aioEnv "AUDIO_ANALYSIS_ENABLED" | quote }}
            {{- else }}
            - name: AUDIO_ANALYSIS_ENABLED
              value: {{ .Values.config.features.audioAnalysis | quote }}
            {{- end }}
            {{- if hasKey $aioEnv "DISCOVERY_ENABLED" }}
            - name: DISCOVERY_ENABLED
              value: {{ index $aioEnv "DISCOVERY_ENABLED" | quote }}
            {{- else }}
            - name: DISCOVERY_ENABLED
              value: {{ .Values.config.features.discovery | quote }}
            {{- end }}
            {{- if hasKey $aioEnv "AUTO_PLAYLISTS_ENABLED" }}
            - name: AUTO_PLAYLISTS_ENABLED
              value: {{ index $aioEnv "AUTO_PLAYLISTS_ENABLED" | quote }}
            {{- else }}
            - name: AUTO_PLAYLISTS_ENABLED
              value: {{ .Values.config.features.autoPlaylists | quote }}
            {{- end }}
            {{- if hasKey $aioEnv "FEATURE_REQUESTS" }}
            - name: FEATURE_REQUESTS
              value: {{ index $aioEnv "FEATURE_REQUESTS" | quote }}
            {{- else }}
            - name: FEATURE_REQUESTS
              value: {{ .Values.config.features.requests | quote }}
            {{- end }}
            # Audio analysis
            {{- range $key := keys $aioEnv | sortAlpha }}
            {{- if not (hasKey $aioExplicitEnvKeys $key) }}
            - name: {{ $key }}
              value: {{ index $aioEnv $key | quote }}
            {{- end }}
            {{- end }}
            # Streaming sidecar URLs
            {{- if hasKey $aioEnv "TIDAL_SIDECAR_URL" }}
            - name: TIDAL_SIDECAR_URL
              value: {{ index $aioEnv "TIDAL_SIDECAR_URL" | quote }}
            {{- else }}
            - name: TIDAL_SIDECAR_URL
              value: {{ include "soundspan.tidalSidecarUrl" . | quote }}
            {{- end }}
            {{- if hasKey $aioEnv "YTMUSIC_STREAMER_URL" }}
            - name: YTMUSIC_STREAMER_URL
              value: {{ index $aioEnv "YTMUSIC_STREAMER_URL" | quote }}
            {{- else }}
            - name: YTMUSIC_STREAMER_URL
              value: {{ include "soundspan.ytmusicStreamerUrl" . | quote }}
            {{- end }}
            {{- if hasKey $aioEnv "LIDARR_ENABLED" }}
            - name: LIDARR_ENABLED
              value: {{ index $aioEnv "LIDARR_ENABLED" | quote }}
            {{- else if .Values.config.lidarrEnabled }}
            - name: LIDARR_ENABLED
              value: "true"
            {{- end }}
            {{- if hasKey $aioEnv "LIDARR_URL" }}
            - name: LIDARR_URL
              value: {{ index $aioEnv "LIDARR_URL" | quote }}
            {{- else if .Values.config.lidarrEnabled }}
            - name: LIDARR_URL
              value: {{ .Values.config.lidarrUrl | quote }}
            {{- end }}
            {{- include "soundspan.optionalSecretEnv" (dict "ctx" . "name" "LIDARR_API_KEY" "secretKey" "LIDARR_API_KEY" "value" .Values.config.lidarrApiKey "enabled" .Values.config.lidarrEnabled "envMap" $aioEnv) | nindent 12 }}
            {{- if hasKey $aioEnv "AUDIOBOOKSHELF_URL" }}
            - name: AUDIOBOOKSHELF_URL
              value: {{ index $aioEnv "AUDIOBOOKSHELF_URL" | quote }}
            {{- else if .Values.config.audiobookshelfUrl }}
            - name: AUDIOBOOKSHELF_URL
              value: {{ .Values.config.audiobookshelfUrl | quote }}
            {{- end }}
            {{- include "soundspan.optionalSecretEnv" (dict "ctx" . "name" "AUDIOBOOKSHELF_TOKEN" "secretKey" "AUDIOBOOKSHELF_TOKEN" "value" .Values.config.audiobookshelfToken "enabled" .Values.config.audiobookshelfUrl "envMap" $aioEnv) | nindent 12 }}
            {{- include "soundspan.optionalSecretEnv" (dict "ctx" . "name" "LASTFM_API_KEY" "secretKey" "LASTFM_API_KEY" "value" .Values.config.lastfmApiKey "enabled" (or .Values.config.lastfmApiKey .Values.secrets.apiKeysInExistingSecret) "envMap" $aioEnv) | nindent 12 }}
            {{- include "soundspan.optionalSecretEnv" (dict "ctx" . "name" "LASTFM_SHARED_SECRET" "secretKey" "LASTFM_SHARED_SECRET" "value" .Values.config.lastfmSharedSecret "enabled" (or .Values.config.lastfmSharedSecret .Values.secrets.apiKeysInExistingSecret) "envMap" $aioEnv) | nindent 12 }}
            {{- include "soundspan.optionalSecretEnv" (dict "ctx" . "name" "FANART_API_KEY" "secretKey" "FANART_API_KEY" "value" .Values.config.fanartApiKey "enabled" .Values.config.fanartApiKey "envMap" $aioEnv) | nindent 12 }}
            {{- include "soundspan.optionalSecretEnv" (dict "ctx" . "name" "OPENAI_API_KEY" "secretKey" "OPENAI_API_KEY" "value" .Values.config.openaiApiKey "enabled" .Values.config.openaiApiKey "envMap" $aioEnv) | nindent 12 }}
            {{- include "soundspan.optionalSecretEnv" (dict "ctx" . "name" "ACOUSTID_API_KEY" "secretKey" "ACOUSTID_API_KEY" "value" .Values.config.acoustidApiKey "enabled" (or .Values.config.acoustidApiKey (and .Values.secrets.existingSecret .Values.secrets.apiKeysInExistingSecret)) "envMap" $aioEnv) | nindent 12 }}
          {{- $globalEnv := .Values.global.env | default (dict) }}
          {{- $globalEnvFrom := .Values.global.envFrom | default (list) }}
          {{- $aioEnvFrom := .Values.aio.envFrom | default (list) }}
          {{- if or (gt (len $globalEnv) 0) (gt (len $globalEnvFrom) 0) (gt (len $aioEnvFrom) 0) }}
          envFrom:
            {{- if gt (len $globalEnv) 0 }}
            - configMapRef:
                name: {{ include "soundspan.fullname" . }}-global-env
            {{- end }}
            {{- with $globalEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $aioEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: music
              mountPath: /music
            - name: data
              mountPath: /data
          startupProbe:
            exec:
              command: ["node", "/app/healthcheck.js"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["node", "/app/healthcheck.js"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["node", "/app/healthcheck.js"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            {{- if .Values.aio.gpu.enabled }}
            requests:
              {{- toYaml .Values.aio.resources.requests | nindent 14 }}
            limits:
              {{- toYaml .Values.aio.resources.limits | nindent 14 }}
              nvidia.com/gpu: {{ .Values.aio.gpu.count | default 1 }}
            {{- else }}
            {{- toYaml .Values.aio.resources | nindent 12 }}
            {{- end }}
      volumes:
        - name: music
          {{- if .Values.music.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.music.persistence.existingClaim }}
          {{- else if .Values.music.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "soundspan.fullname" . }}-music
          {{- else if .Values.music.hostPath }}
          hostPath:
            path: {{ .Values.music.hostPath }}
            type: Directory
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: data
          {{- if .Values.aio.persistence.data.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.aio.persistence.data.existingClaim }}
          {{- else if .Values.aio.persistence.data.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "soundspan.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
