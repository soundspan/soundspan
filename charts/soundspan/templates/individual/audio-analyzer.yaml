{{- if and (eq .Values.deploymentMode "individual") .Values.audioAnalyzer.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "soundspan.fullname" . }}-audio-analyzer
  labels:
    {{- include "soundspan.componentLabels" (dict "context" . "component" "audio-analyzer") | nindent 4 }}
spec:
  replicas: {{ .Values.audioAnalyzer.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "soundspan.componentSelectorLabels" (dict "context" . "component" "audio-analyzer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "soundspan.componentPodLabels" (dict "context" . "component" "audio-analyzer") | nindent 8 }}
      {{- with .Values.global.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "soundspan.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.global.automountServiceAccountToken }}
      {{- if and .Values.audioAnalyzer.gpu.enabled .Values.audioAnalyzer.gpu.runtimeClassName }}
      runtimeClassName: {{ .Values.audioAnalyzer.gpu.runtimeClassName | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: audio-analyzer
          image: {{ include "soundspan.image" .Values.audioAnalyzer.image | quote }}
          imagePullPolicy: {{ .Values.audioAnalyzer.image.pullPolicy }}
          {{- $audioAnalyzerEnv := .Values.audioAnalyzer.env | default (dict) }}
          {{- $audioAnalyzerBuildDatabaseUrl := and (not (hasKey $audioAnalyzerEnv "DATABASE_URL")) (not .Values.postgresql.external.url) }}
          {{- if $audioAnalyzerBuildDatabaseUrl }}
          command:
            - /bin/sh
            - -c
          args:
            - |-
              {{- include "soundspan.pythonDatabaseUrlStartup" . | nindent 14 }}
            - soundspan-database-url
            - python3
            - analyzer.py
          {{- end }}
          securityContext:
            {{- toYaml .Values.global.securityContext | nindent 12 }}
          {{- $audioAnalyzerHasPostgresSecretEnv := not .Values.postgresql.external.url }}
          {{- $audioAnalyzerExplicitEnvKeys := dict
            "POSTGRES_USER" true
            "POSTGRES_PASSWORD" true
            "POSTGRES_DB" true
            "SOUNDSPAN_DATABASE_HOST" true
            "SOUNDSPAN_DATABASE_PORT" true
            "DATABASE_URL" true
            "REDIS_URL" true
            "MUSIC_PATH" true
            "TZ" true
            "ACOUSTID_API_KEY" true
          }}
          env:
            {{- if hasKey $audioAnalyzerEnv "POSTGRES_USER" }}
            - name: POSTGRES_USER
              value: {{ index $audioAnalyzerEnv "POSTGRES_USER" | quote }}
            {{- else if $audioAnalyzerHasPostgresSecretEnv }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "soundspan.secretName" . }}
                  key: POSTGRES_USER
            {{- end }}
            {{- if hasKey $audioAnalyzerEnv "POSTGRES_PASSWORD" }}
            - name: POSTGRES_PASSWORD
              value: {{ index $audioAnalyzerEnv "POSTGRES_PASSWORD" | quote }}
            {{- else if $audioAnalyzerHasPostgresSecretEnv }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "soundspan.secretName" . }}
                  key: POSTGRES_PASSWORD
            {{- end }}
            {{- if hasKey $audioAnalyzerEnv "POSTGRES_DB" }}
            - name: POSTGRES_DB
              value: {{ index $audioAnalyzerEnv "POSTGRES_DB" | quote }}
            {{- else if $audioAnalyzerHasPostgresSecretEnv }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "soundspan.secretName" . }}
                  key: POSTGRES_DB
            {{- end }}
            {{- if $audioAnalyzerBuildDatabaseUrl }}
            - name: SOUNDSPAN_DATABASE_HOST
              value: {{ include "soundspan.databaseHost" . | quote }}
            - name: SOUNDSPAN_DATABASE_PORT
              value: {{ include "soundspan.databasePort" . | quote }}
            {{- end }}
            {{- if hasKey $audioAnalyzerEnv "DATABASE_URL" }}
            - name: DATABASE_URL
              value: {{ index $audioAnalyzerEnv "DATABASE_URL" | quote }}
            {{- else if .Values.postgresql.external.url }}
            - name: DATABASE_URL
              value: {{ include "soundspan.databaseUrl" . | quote }}
            {{- end }}
            {{- if hasKey $audioAnalyzerEnv "REDIS_URL" }}
            - name: REDIS_URL
              value: {{ index $audioAnalyzerEnv "REDIS_URL" | quote }}
            {{- else }}
            - name: REDIS_URL
              value: {{ include "soundspan.redisUrl" . | quote }}
            {{- end }}
            {{- if hasKey $audioAnalyzerEnv "MUSIC_PATH" }}
            - name: MUSIC_PATH
              value: {{ index $audioAnalyzerEnv "MUSIC_PATH" | quote }}
            {{- else }}
            - name: MUSIC_PATH
              value: /music
            {{- end }}
            {{- if hasKey $audioAnalyzerEnv "TZ" }}
            - name: TZ
              value: {{ index $audioAnalyzerEnv "TZ" | quote }}
            {{- else }}
            - name: TZ
              value: {{ .Values.config.timezone | quote }}
            {{- end }}
            {{- include "soundspan.optionalSecretEnv" (dict "ctx" . "name" "ACOUSTID_API_KEY" "secretKey" "ACOUSTID_API_KEY" "value" .Values.config.acoustidApiKey "enabled" (or .Values.config.acoustidApiKey (and .Values.secrets.existingSecret .Values.secrets.apiKeysInExistingSecret)) "envMap" $audioAnalyzerEnv) | nindent 12 }}
            {{- range $key := keys $audioAnalyzerEnv | sortAlpha }}
            {{- if not (hasKey $audioAnalyzerExplicitEnvKeys $key) }}
            - name: {{ $key }}
              value: {{ index $audioAnalyzerEnv $key | quote }}
            {{- end }}
            {{- end }}
          {{- $globalEnv := .Values.global.env | default (dict) }}
          {{- $globalEnvFrom := .Values.global.envFrom | default (list) }}
          {{- $audioAnalyzerEnvFrom := .Values.audioAnalyzer.envFrom | default (list) }}
          {{- if or (gt (len $globalEnv) 0) (gt (len $globalEnvFrom) 0) (gt (len $audioAnalyzerEnvFrom) 0) }}
          envFrom:
            {{- if gt (len $globalEnv) 0 }}
            - configMapRef:
                name: {{ include "soundspan.fullname" . }}-global-env
            {{- end }}
            {{- with $globalEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $audioAnalyzerEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: music
              mountPath: /music
              readOnly: true
          {{- with .Values.audioAnalyzer.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.audioAnalyzer.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- if .Values.audioAnalyzer.gpu.enabled }}
            requests:
              {{- toYaml .Values.audioAnalyzer.resources.requests | nindent 14 }}
            limits:
              {{- toYaml .Values.audioAnalyzer.resources.limits | nindent 14 }}
              nvidia.com/gpu: {{ .Values.audioAnalyzer.gpu.count | default 1 }}
            {{- else }}
            {{- toYaml .Values.audioAnalyzer.resources | nindent 12 }}
            {{- end }}
      volumes:
        - name: music
          {{- if .Values.music.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.music.persistence.existingClaim }}
          {{- else if .Values.music.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "soundspan.fullname" . }}-music
          {{- else if .Values.music.hostPath }}
          hostPath:
            path: {{ .Values.music.hostPath }}
            type: Directory
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.audioAnalyzer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.audioAnalyzer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.audioAnalyzer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
{{- end }}
