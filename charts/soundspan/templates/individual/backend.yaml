{{- if eq .Values.deploymentMode "individual" }}
{{- $haEnabled := eq (include "soundspan.haEnabled" .) "true" }}
{{- $backendReplicas := include "soundspan.backendReplicas" . | int }}
{{- $backendWorkerEnabled := eq (include "soundspan.backendWorkerEnabled" .) "true" }}
{{- $backendPdbEnabled := and (gt $backendReplicas 1) (ternary .Values.haMode.pdb.enabled .Values.backend.pdb.enabled $haEnabled) }}
{{- $ltRedisAdapterEnabled := ternary .Values.haMode.runtime.listenTogetherRedisAdapterEnabled .Values.config.listenTogetherRedisAdapterEnabled $haEnabled }}
{{- $ltStateSyncEnabled := ternary .Values.haMode.runtime.listenTogetherStateSyncEnabled .Values.config.listenTogetherStateSyncEnabled $haEnabled }}
{{- $ltStateStoreEnabled := ternary .Values.haMode.runtime.listenTogetherStateStoreEnabled .Values.config.listenTogetherStateStoreEnabled $haEnabled }}
{{- $ltMutationLockEnabled := ternary .Values.haMode.runtime.listenTogetherMutationLockEnabled .Values.config.listenTogetherMutationLockEnabled $haEnabled }}
{{- $ltAllowPolling := ternary .Values.haMode.runtime.listenTogetherAllowPolling .Values.config.listenTogetherAllowPolling $haEnabled }}
{{- $readinessRequireDependencies := ternary .Values.haMode.runtime.readinessRequireDependencies .Values.config.readinessRequireDependencies $haEnabled }}
{{- $backendCacheType := default "pvc" .Values.backend.persistence.cache.type }}
{{- $backendLogsType := default "pvc" .Values.backend.persistence.logs.type }}
{{- if and $haEnabled (gt $backendReplicas 1) .Values.backend.persistence.cache.enabled (eq $backendCacheType "pvc") (not .Values.backend.persistence.cache.existingClaim) (ne .Values.backend.persistence.cache.accessMode "ReadWriteMany") }}
{{- $backendCacheType = "emptyDir" }}
{{- end }}
{{- if and $haEnabled (gt $backendReplicas 1) .Values.backend.persistence.logs.enabled (eq $backendLogsType "pvc") (not .Values.backend.persistence.logs.existingClaim) (ne .Values.backend.persistence.logs.accessMode "ReadWriteMany") }}
{{- $backendLogsType = "emptyDir" }}
{{- end }}
{{- if and .Values.backend.persistence.cache.enabled (not (or (eq $backendCacheType "pvc") (eq $backendCacheType "emptyDir"))) }}
{{- fail "backend.persistence.cache.type must be one of: pvc, emptyDir" }}
{{- end }}
{{- if and .Values.backend.persistence.logs.enabled (not (or (eq $backendLogsType "pvc") (eq $backendLogsType "emptyDir"))) }}
{{- fail "backend.persistence.logs.type must be one of: pvc, emptyDir" }}
{{- end }}
{{- if and (gt $backendReplicas 1) .Values.backend.persistence.cache.enabled (eq $backendCacheType "pvc") (not .Values.backend.persistence.cache.existingClaim) (ne .Values.backend.persistence.cache.accessMode "ReadWriteMany") }}
{{- fail "backend.persistence.cache: backend.replicas > 1 with type=pvc requires ReadWriteMany access mode, an explicit existingClaim, setting type=emptyDir, or disabling backend.persistence.cache.enabled" }}
{{- end }}
{{- if and (gt $backendReplicas 1) .Values.backend.persistence.logs.enabled (eq $backendLogsType "pvc") (not .Values.backend.persistence.logs.existingClaim) (ne .Values.backend.persistence.logs.accessMode "ReadWriteMany") }}
{{- fail "backend.persistence.logs: backend.replicas > 1 with type=pvc requires ReadWriteMany access mode, an explicit existingClaim, setting type=emptyDir, or disabling backend.persistence.logs.enabled" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "soundspan.fullname" . }}-backend
  labels:
    {{- include "soundspan.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
spec:
  replicas: {{ $backendReplicas }}
  strategy:
    {{- toYaml .Values.backend.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "soundspan.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "soundspan.componentPodLabels" (dict "context" . "component" "backend") | nindent 8 }}
      {{- with .Values.global.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "soundspan.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.global.automountServiceAccountToken }}
      securityContext:
        {{- toYaml .Values.global.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds | default 45 }}
      containers:
        - name: backend
          image: {{ include "soundspan.image" .Values.backend.image | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          {{- $backendEnv := .Values.backend.env | default (dict) }}
          {{- $backendBuildDatabaseUrl := and (not (hasKey $backendEnv "DATABASE_URL")) (not .Values.postgresql.external.url) }}
          {{- if $backendBuildDatabaseUrl }}
          command:
            - /usr/bin/tini
            - --
            - /bin/sh
            - -c
          args:
            - |-
              {{- include "soundspan.nodeDatabaseUrlStartup" . | nindent 14 }}
            - soundspan-database-url
            - /usr/local/bin/docker-entrypoint.sh
            - node
            - dist/index.js
          {{- end }}
          securityContext:
            {{- toYaml .Values.global.securityContext | nindent 12 }}
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep {{ .Values.backend.lifecycle.preStopSleepSeconds | default 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
              protocol: TCP
          {{- $backendHasPostgresSecretEnv := not .Values.postgresql.external.url }}
          {{- $backendExplicitEnvKeys := dict
            "NODE_ENV" true
            "PORT" true
            "TZ" true
            "BACKEND_PROCESS_ROLE" true
            "LISTEN_TOGETHER_REDIS_ADAPTER_ENABLED" true
            "LISTEN_TOGETHER_STATE_SYNC_ENABLED" true
            "LISTEN_TOGETHER_STATE_STORE_ENABLED" true
            "LISTEN_TOGETHER_STATE_STORE_TTL_SECONDS" true
            "LISTEN_TOGETHER_STATE_STORE_KEY_PREFIX" true
            "LISTEN_TOGETHER_MUTATION_LOCK_ENABLED" true
            "LISTEN_TOGETHER_MUTATION_LOCK_TTL_MS" true
            "LISTEN_TOGETHER_MUTATION_LOCK_PREFIX" true
            "LISTEN_TOGETHER_RECONNECT_SLO_MS" true
            "LISTEN_TOGETHER_ALLOW_POLLING" true
            "SCHEDULER_CLAIM_SKIP_WARN_THRESHOLD" true
            "READINESS_REQUIRE_DEPENDENCIES" true
            "READINESS_DEPENDENCY_CHECK_INTERVAL_MS" true
            "READINESS_DEPENDENCY_CHECK_TIMEOUT_MS" true
            "MUSIC_PATH" true
            "TRANSCODE_CACHE_PATH" true
            "POSTGRES_USER" true
            "POSTGRES_PASSWORD" true
            "POSTGRES_DB" true
            "SOUNDSPAN_DATABASE_HOST" true
            "SOUNDSPAN_DATABASE_PORT" true
            "DATABASE_URL" true
            "REDIS_URL" true
            "REDIS_FLUSH_ON_STARTUP" true
            "SESSION_SECRET" true
            "SETTINGS_ENCRYPTION_KEY" true
            "INTERNAL_API_SECRET" true
            "METRICS_TOKEN" true
            "METRICS_PUBLIC" true
            "LOCAL_LOGIN_ENABLED" true
            "OIDC_ENABLED" true
            "OIDC_ISSUER_URL" true
            "OIDC_CLIENT_ID" true
            "OIDC_CLIENT_SECRET" true
            "OIDC_REDIRECT_URI" true
            "OIDC_WEB_BASE_URL" true
            "OIDC_SCOPES" true
            "OIDC_AUTO_PROVISION" true
            "OIDC_MANAGE_ROLES" true
            "OIDC_GROUPS_CLAIM" true
            "OIDC_ADMIN_GROUP" true
            "OIDC_EMAIL_CLAIM" true
            "OIDC_NAME_CLAIM" true
            "OIDC_PROVIDER_NAME" true
            "TIDAL_SIDECAR_URL" true
            "YTMUSIC_STREAMER_URL" true
            "VIBE_PROVIDER_URL" true
            "ALLOWED_ORIGINS" true
            "LOG_LEVEL" true
            "DOCS_PUBLIC" true
            "AUDIO_ANALYSIS_ENABLED" true
            "DISCOVERY_ENABLED" true
            "AUTO_PLAYLISTS_ENABLED" true
            "FEATURE_REQUESTS" true
            "FEDERATION_ENABLED" true
            "SCAN_FILE_CONCURRENCY" true
            "CATALOG_PERSISTENCE" true
            "CATALOG_RETENTION_DAYS" true
            "FEDERATION_TOMBSTONE_RETENTION_DAYS" true
            "PROVIDER_TRACK_RETENTION_DAYS" true
            "FEDERATION_SYNC_INTERVAL_MINUTES" true
            "LIDARR_ENABLED" true
            "LIDARR_URL" true
            "LIDARR_API_KEY" true
            "AUDIOBOOKSHELF_URL" true
            "AUDIOBOOKSHELF_TOKEN" true
            "LASTFM_API_KEY" true
            "LASTFM_SHARED_SECRET" true
            "FANART_API_KEY" true
            "OPENAI_API_KEY" true
          }}
          env:
            {{- if hasKey $backendEnv "NODE_ENV" }}
            - name: NODE_ENV
              value: {{ index $backendEnv "NODE_ENV" | quote }}
            {{- else }}
            - name: NODE_ENV
              value: {{ .Values.config.nodeEnv | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "PORT" }}
            - name: PORT
              value: {{ index $backendEnv "PORT" | quote }}
            {{- else }}
            - name: PORT
              value: {{ .Values.backend.port | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "TZ" }}
            - name: TZ
              value: {{ index $backendEnv "TZ" | quote }}
            {{- else }}
            - name: TZ
              value: {{ .Values.config.timezone | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "BACKEND_PROCESS_ROLE" }}
            - name: BACKEND_PROCESS_ROLE
              value: {{ index $backendEnv "BACKEND_PROCESS_ROLE" | quote }}
            {{- else }}
            - name: BACKEND_PROCESS_ROLE
              value: {{ (default (ternary "api" "all" $backendWorkerEnabled) .Values.backend.processRole) | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "LISTEN_TOGETHER_REDIS_ADAPTER_ENABLED" }}
            - name: LISTEN_TOGETHER_REDIS_ADAPTER_ENABLED
              value: {{ index $backendEnv "LISTEN_TOGETHER_REDIS_ADAPTER_ENABLED" | quote }}
            {{- else }}
            - name: LISTEN_TOGETHER_REDIS_ADAPTER_ENABLED
              value: {{ $ltRedisAdapterEnabled | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "LISTEN_TOGETHER_STATE_SYNC_ENABLED" }}
            - name: LISTEN_TOGETHER_STATE_SYNC_ENABLED
              value: {{ index $backendEnv "LISTEN_TOGETHER_STATE_SYNC_ENABLED" | quote }}
            {{- else }}
            - name: LISTEN_TOGETHER_STATE_SYNC_ENABLED
              value: {{ $ltStateSyncEnabled | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "LISTEN_TOGETHER_STATE_STORE_ENABLED" }}
            - name: LISTEN_TOGETHER_STATE_STORE_ENABLED
              value: {{ index $backendEnv "LISTEN_TOGETHER_STATE_STORE_ENABLED" | quote }}
            {{- else }}
            - name: LISTEN_TOGETHER_STATE_STORE_ENABLED
              value: {{ $ltStateStoreEnabled | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "LISTEN_TOGETHER_STATE_STORE_TTL_SECONDS" }}
            - name: LISTEN_TOGETHER_STATE_STORE_TTL_SECONDS
              value: {{ index $backendEnv "LISTEN_TOGETHER_STATE_STORE_TTL_SECONDS" | quote }}
            {{- else }}
            - name: LISTEN_TOGETHER_STATE_STORE_TTL_SECONDS
              value: {{ .Values.config.listenTogetherStateStoreTtlSeconds | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "LISTEN_TOGETHER_STATE_STORE_KEY_PREFIX" }}
            - name: LISTEN_TOGETHER_STATE_STORE_KEY_PREFIX
              value: {{ index $backendEnv "LISTEN_TOGETHER_STATE_STORE_KEY_PREFIX" | quote }}
            {{- else }}
            - name: LISTEN_TOGETHER_STATE_STORE_KEY_PREFIX
              value: {{ .Values.config.listenTogetherStateStoreKeyPrefix | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "LISTEN_TOGETHER_MUTATION_LOCK_ENABLED" }}
            - name: LISTEN_TOGETHER_MUTATION_LOCK_ENABLED
              value: {{ index $backendEnv "LISTEN_TOGETHER_MUTATION_LOCK_ENABLED" | quote }}
            {{- else }}
            - name: LISTEN_TOGETHER_MUTATION_LOCK_ENABLED
              value: {{ $ltMutationLockEnabled | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "LISTEN_TOGETHER_MUTATION_LOCK_TTL_MS" }}
            - name: LISTEN_TOGETHER_MUTATION_LOCK_TTL_MS
              value: {{ index $backendEnv "LISTEN_TOGETHER_MUTATION_LOCK_TTL_MS" | quote }}
            {{- else }}
            - name: LISTEN_TOGETHER_MUTATION_LOCK_TTL_MS
              value: {{ .Values.config.listenTogetherMutationLockTtlMs | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "LISTEN_TOGETHER_MUTATION_LOCK_PREFIX" }}
            - name: LISTEN_TOGETHER_MUTATION_LOCK_PREFIX
              value: {{ index $backendEnv "LISTEN_TOGETHER_MUTATION_LOCK_PREFIX" | quote }}
            {{- else }}
            - name: LISTEN_TOGETHER_MUTATION_LOCK_PREFIX
              value: {{ .Values.config.listenTogetherMutationLockPrefix | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "LISTEN_TOGETHER_RECONNECT_SLO_MS" }}
            - name: LISTEN_TOGETHER_RECONNECT_SLO_MS
              value: {{ index $backendEnv "LISTEN_TOGETHER_RECONNECT_SLO_MS" | quote }}
            {{- else }}
            - name: LISTEN_TOGETHER_RECONNECT_SLO_MS
              value: {{ .Values.config.listenTogetherReconnectSloMs | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "LISTEN_TOGETHER_ALLOW_POLLING" }}
            - name: LISTEN_TOGETHER_ALLOW_POLLING
              value: {{ index $backendEnv "LISTEN_TOGETHER_ALLOW_POLLING" | quote }}
            {{- else }}
            - name: LISTEN_TOGETHER_ALLOW_POLLING
              value: {{ $ltAllowPolling | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "SCHEDULER_CLAIM_SKIP_WARN_THRESHOLD" }}
            - name: SCHEDULER_CLAIM_SKIP_WARN_THRESHOLD
              value: {{ index $backendEnv "SCHEDULER_CLAIM_SKIP_WARN_THRESHOLD" | quote }}
            {{- else }}
            - name: SCHEDULER_CLAIM_SKIP_WARN_THRESHOLD
              value: {{ .Values.config.schedulerClaimSkipWarnThreshold | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "READINESS_REQUIRE_DEPENDENCIES" }}
            - name: READINESS_REQUIRE_DEPENDENCIES
              value: {{ index $backendEnv "READINESS_REQUIRE_DEPENDENCIES" | quote }}
            {{- else }}
            - name: READINESS_REQUIRE_DEPENDENCIES
              value: {{ $readinessRequireDependencies | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "READINESS_DEPENDENCY_CHECK_INTERVAL_MS" }}
            - name: READINESS_DEPENDENCY_CHECK_INTERVAL_MS
              value: {{ index $backendEnv "READINESS_DEPENDENCY_CHECK_INTERVAL_MS" | quote }}
            {{- else }}
            - name: READINESS_DEPENDENCY_CHECK_INTERVAL_MS
              value: {{ .Values.config.readinessDependencyCheckIntervalMs | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "READINESS_DEPENDENCY_CHECK_TIMEOUT_MS" }}
            - name: READINESS_DEPENDENCY_CHECK_TIMEOUT_MS
              value: {{ index $backendEnv "READINESS_DEPENDENCY_CHECK_TIMEOUT_MS" | quote }}
            {{- else }}
            - name: READINESS_DEPENDENCY_CHECK_TIMEOUT_MS
              value: {{ .Values.config.readinessDependencyCheckTimeoutMs | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "MUSIC_PATH" }}
            - name: MUSIC_PATH
              value: {{ index $backendEnv "MUSIC_PATH" | quote }}
            {{- else }}
            - name: MUSIC_PATH
              value: /music
            {{- end }}
            {{- if hasKey $backendEnv "TRANSCODE_CACHE_PATH" }}
            - name: TRANSCODE_CACHE_PATH
              value: {{ index $backendEnv "TRANSCODE_CACHE_PATH" | quote }}
            {{- else }}
            - name: TRANSCODE_CACHE_PATH
              value: /music/.soundspan/transcodes
            {{- end }}
            # Secret-backed env vars
            {{- if hasKey $backendEnv "POSTGRES_USER" }}
            - name: POSTGRES_USER
              value: {{ index $backendEnv "POSTGRES_USER" | quote }}
            {{- else if $backendHasPostgresSecretEnv }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "soundspan.secretName" . }}
                  key: POSTGRES_USER
            {{- end }}
            {{- if hasKey $backendEnv "POSTGRES_PASSWORD" }}
            - name: POSTGRES_PASSWORD
              value: {{ index $backendEnv "POSTGRES_PASSWORD" | quote }}
            {{- else if $backendHasPostgresSecretEnv }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "soundspan.secretName" . }}
                  key: POSTGRES_PASSWORD
            {{- end }}
            {{- if hasKey $backendEnv "POSTGRES_DB" }}
            - name: POSTGRES_DB
              value: {{ index $backendEnv "POSTGRES_DB" | quote }}
            {{- else if $backendHasPostgresSecretEnv }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "soundspan.secretName" . }}
                  key: POSTGRES_DB
            {{- end }}
            {{- if $backendBuildDatabaseUrl }}
            - name: SOUNDSPAN_DATABASE_HOST
              value: {{ include "soundspan.databaseHost" . | quote }}
            - name: SOUNDSPAN_DATABASE_PORT
              value: {{ include "soundspan.databasePort" . | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "DATABASE_URL" }}
            - name: DATABASE_URL
              value: {{ index $backendEnv "DATABASE_URL" | quote }}
            {{- else if .Values.postgresql.external.url }}
            - name: DATABASE_URL
              value: {{ include "soundspan.databaseUrl" . | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "REDIS_URL" }}
            - name: REDIS_URL
              value: {{ index $backendEnv "REDIS_URL" | quote }}
            {{- else }}
            - name: REDIS_URL
              value: {{ include "soundspan.redisUrl" . | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "REDIS_FLUSH_ON_STARTUP" }}
            - name: REDIS_FLUSH_ON_STARTUP
              value: {{ index $backendEnv "REDIS_FLUSH_ON_STARTUP" | quote }}
            {{- else }}
            - name: REDIS_FLUSH_ON_STARTUP
              value: {{ .Values.config.redisFlushOnStartup | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "SESSION_SECRET" }}
            - name: SESSION_SECRET
              value: {{ index $backendEnv "SESSION_SECRET" | quote }}
            {{- else }}
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "soundspan.secretName" . }}
                  key: SESSION_SECRET
            {{- end }}
            {{- if hasKey $backendEnv "SETTINGS_ENCRYPTION_KEY" }}
            - name: SETTINGS_ENCRYPTION_KEY
              value: {{ index $backendEnv "SETTINGS_ENCRYPTION_KEY" | quote }}
            {{- else }}
            - name: SETTINGS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "soundspan.secretName" . }}
                  key: SETTINGS_ENCRYPTION_KEY
            {{- end }}
            {{- if hasKey $backendEnv "INTERNAL_API_SECRET" }}
            - name: INTERNAL_API_SECRET
              value: {{ index $backendEnv "INTERNAL_API_SECRET" | quote }}
            {{- else }}
            - name: INTERNAL_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "soundspan.secretName" . }}
                  key: INTERNAL_API_SECRET
            {{- end }}
            {{- if hasKey $backendEnv "METRICS_TOKEN" }}
            - name: METRICS_TOKEN
              value: {{ index $backendEnv "METRICS_TOKEN" | quote }}
            {{- else }}
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "soundspan.secretName" . }}
                  key: METRICS_TOKEN
                  optional: true
            {{- end }}
            {{- if hasKey $backendEnv "METRICS_PUBLIC" }}
            - name: METRICS_PUBLIC
              value: {{ index $backendEnv "METRICS_PUBLIC" | quote }}
            {{- else if .Values.metrics.public }}
            - name: METRICS_PUBLIC
              value: "true"
            {{- end }}
            {{- include "soundspan.oidcEnv" (dict "ctx" . "envMap" $backendEnv) | nindent 12 }}
            {{- if hasKey $backendEnv "TIDAL_SIDECAR_URL" }}
            - name: TIDAL_SIDECAR_URL
              value: {{ index $backendEnv "TIDAL_SIDECAR_URL" | quote }}
            {{- else }}
            - name: TIDAL_SIDECAR_URL
              value: {{ include "soundspan.tidalSidecarUrl" . | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "YTMUSIC_STREAMER_URL" }}
            - name: YTMUSIC_STREAMER_URL
              value: {{ index $backendEnv "YTMUSIC_STREAMER_URL" | quote }}
            {{- else }}
            - name: YTMUSIC_STREAMER_URL
              value: {{ include "soundspan.ytmusicStreamerUrl" . | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "VIBE_PROVIDER_URL" }}
            - name: VIBE_PROVIDER_URL
              value: {{ index $backendEnv "VIBE_PROVIDER_URL" | quote }}
            {{- else if .Values.vibeProviderDclap.enabled }}
            - name: VIBE_PROVIDER_URL
              value: {{ printf "http://%s-vibe-provider-dclap:%v" (include "soundspan.fullname" .) .Values.vibeProviderDclap.port | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "ALLOWED_ORIGINS" }}
            - name: ALLOWED_ORIGINS
              value: {{ index $backendEnv "ALLOWED_ORIGINS" | quote }}
            {{- else if .Values.config.allowedOrigins }}
            - name: ALLOWED_ORIGINS
              value: {{ .Values.config.allowedOrigins | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "LOG_LEVEL" }}
            - name: LOG_LEVEL
              value: {{ index $backendEnv "LOG_LEVEL" | quote }}
            {{- else if .Values.config.logLevel }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "DOCS_PUBLIC" }}
            - name: DOCS_PUBLIC
              value: {{ index $backendEnv "DOCS_PUBLIC" | quote }}
            {{- else if .Values.config.docsPublic }}
            - name: DOCS_PUBLIC
              value: "true"
            {{- end }}
            {{- if hasKey $backendEnv "FEDERATION_ENABLED" }}
            - name: FEDERATION_ENABLED
              value: {{ index $backendEnv "FEDERATION_ENABLED" | quote }}
            {{- else }}
            - name: FEDERATION_ENABLED
              value: {{ .Values.config.features.federation | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "SCAN_FILE_CONCURRENCY" }}
            - name: SCAN_FILE_CONCURRENCY
              value: {{ index $backendEnv "SCAN_FILE_CONCURRENCY" | quote }}
            {{- else if not (kindIs "invalid" .Values.config.scanFileConcurrency) }}
            - name: SCAN_FILE_CONCURRENCY
              value: {{ .Values.config.scanFileConcurrency | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "CATALOG_PERSISTENCE" }}
            - name: CATALOG_PERSISTENCE
              value: {{ index $backendEnv "CATALOG_PERSISTENCE" | quote }}
            {{- else if not (kindIs "invalid" .Values.config.catalogPersistence) }}
            - name: CATALOG_PERSISTENCE
              value: {{ .Values.config.catalogPersistence | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "CATALOG_RETENTION_DAYS" }}
            - name: CATALOG_RETENTION_DAYS
              value: {{ index $backendEnv "CATALOG_RETENTION_DAYS" | quote }}
            {{- else if not (kindIs "invalid" .Values.config.catalogRetentionDays) }}
            - name: CATALOG_RETENTION_DAYS
              value: {{ .Values.config.catalogRetentionDays | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "FEDERATION_TOMBSTONE_RETENTION_DAYS" }}
            - name: FEDERATION_TOMBSTONE_RETENTION_DAYS
              value: {{ index $backendEnv "FEDERATION_TOMBSTONE_RETENTION_DAYS" | quote }}
            {{- else }}
            - name: FEDERATION_TOMBSTONE_RETENTION_DAYS
              value: {{ .Values.config.federationTombstoneRetentionDays | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "PROVIDER_TRACK_RETENTION_DAYS" }}
            - name: PROVIDER_TRACK_RETENTION_DAYS
              value: {{ index $backendEnv "PROVIDER_TRACK_RETENTION_DAYS" | quote }}
            {{- else }}
            - name: PROVIDER_TRACK_RETENTION_DAYS
              value: {{ .Values.config.providerTrackRetentionDays | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "FEDERATION_SYNC_INTERVAL_MINUTES" }}
            - name: FEDERATION_SYNC_INTERVAL_MINUTES
              value: {{ index $backendEnv "FEDERATION_SYNC_INTERVAL_MINUTES" | quote }}
            {{- else }}
            - name: FEDERATION_SYNC_INTERVAL_MINUTES
              value: {{ .Values.config.federationSyncIntervalMinutes | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "AUDIO_ANALYSIS_ENABLED" }}
            - name: AUDIO_ANALYSIS_ENABLED
              value: {{ index $backendEnv "AUDIO_ANALYSIS_ENABLED" | quote }}
            {{- else }}
            - name: AUDIO_ANALYSIS_ENABLED
              value: {{ .Values.config.features.audioAnalysis | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "DISCOVERY_ENABLED" }}
            - name: DISCOVERY_ENABLED
              value: {{ index $backendEnv "DISCOVERY_ENABLED" | quote }}
            {{- else }}
            - name: DISCOVERY_ENABLED
              value: {{ .Values.config.features.discovery | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "AUTO_PLAYLISTS_ENABLED" }}
            - name: AUTO_PLAYLISTS_ENABLED
              value: {{ index $backendEnv "AUTO_PLAYLISTS_ENABLED" | quote }}
            {{- else }}
            - name: AUTO_PLAYLISTS_ENABLED
              value: {{ .Values.config.features.autoPlaylists | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "FEATURE_REQUESTS" }}
            - name: FEATURE_REQUESTS
              value: {{ index $backendEnv "FEATURE_REQUESTS" | quote }}
            {{- else }}
            - name: FEATURE_REQUESTS
              value: {{ .Values.config.features.requests | quote }}
            {{- end }}
            {{- if hasKey $backendEnv "LIDARR_ENABLED" }}
            - name: LIDARR_ENABLED
              value: {{ index $backendEnv "LIDARR_ENABLED" | quote }}
            {{- else if .Values.config.lidarrEnabled }}
            - name: LIDARR_ENABLED
              value: "true"
            {{- end }}
            {{- if hasKey $backendEnv "LIDARR_URL" }}
            - name: LIDARR_URL
              value: {{ index $backendEnv "LIDARR_URL" | quote }}
            {{- else if .Values.config.lidarrEnabled }}
            - name: LIDARR_URL
              value: {{ .Values.config.lidarrUrl | quote }}
            {{- end }}
            {{- include "soundspan.optionalSecretEnv" (dict "ctx" . "name" "LIDARR_API_KEY" "secretKey" "LIDARR_API_KEY" "value" .Values.config.lidarrApiKey "enabled" .Values.config.lidarrEnabled "envMap" $backendEnv) | nindent 12 }}
            {{- if hasKey $backendEnv "AUDIOBOOKSHELF_URL" }}
            - name: AUDIOBOOKSHELF_URL
              value: {{ index $backendEnv "AUDIOBOOKSHELF_URL" | quote }}
            {{- else if .Values.config.audiobookshelfUrl }}
            - name: AUDIOBOOKSHELF_URL
              value: {{ .Values.config.audiobookshelfUrl | quote }}
            {{- end }}
            {{- include "soundspan.optionalSecretEnv" (dict "ctx" . "name" "AUDIOBOOKSHELF_TOKEN" "secretKey" "AUDIOBOOKSHELF_TOKEN" "value" .Values.config.audiobookshelfToken "enabled" .Values.config.audiobookshelfUrl "envMap" $backendEnv) | nindent 12 }}
            {{- include "soundspan.optionalSecretEnv" (dict "ctx" . "name" "LASTFM_API_KEY" "secretKey" "LASTFM_API_KEY" "value" .Values.config.lastfmApiKey "enabled" (or .Values.config.lastfmApiKey .Values.secrets.apiKeysInExistingSecret) "envMap" $backendEnv) | nindent 12 }}
            {{- include "soundspan.optionalSecretEnv" (dict "ctx" . "name" "LASTFM_SHARED_SECRET" "secretKey" "LASTFM_SHARED_SECRET" "value" .Values.config.lastfmSharedSecret "enabled" (or .Values.config.lastfmSharedSecret .Values.secrets.apiKeysInExistingSecret) "envMap" $backendEnv) | nindent 12 }}
            {{- include "soundspan.optionalSecretEnv" (dict "ctx" . "name" "FANART_API_KEY" "secretKey" "FANART_API_KEY" "value" .Values.config.fanartApiKey "enabled" .Values.config.fanartApiKey "envMap" $backendEnv) | nindent 12 }}
            {{- include "soundspan.optionalSecretEnv" (dict "ctx" . "name" "OPENAI_API_KEY" "secretKey" "OPENAI_API_KEY" "value" .Values.config.openaiApiKey "enabled" .Values.config.openaiApiKey "envMap" $backendEnv) | nindent 12 }}
            {{- range $key := keys $backendEnv | sortAlpha }}
            {{- if not (hasKey $backendExplicitEnvKeys $key) }}
            - name: {{ $key }}
              value: {{ index $backendEnv $key | quote }}
            {{- end }}
            {{- end }}
          {{- $globalEnv := .Values.global.env | default (dict) }}
          {{- $globalEnvFrom := .Values.global.envFrom | default (list) }}
          {{- $backendEnvFrom := .Values.backend.envFrom | default (list) }}
          {{- if or (gt (len $globalEnv) 0) (gt (len $globalEnvFrom) 0) (gt (len $backendEnvFrom) 0) }}
          envFrom:
            {{- if gt (len $globalEnv) 0 }}
            - configMapRef:
                name: {{ include "soundspan.fullname" . }}-global-env
            {{- end }}
            {{- with $globalEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with $backendEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: music
              mountPath: /music
            {{- if .Values.backend.persistence.cache.enabled }}
            - name: cache
              mountPath: /app/cache
            {{- end }}
            {{- if .Values.backend.persistence.logs.enabled }}
            - name: logs
              mountPath: /app/logs
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      volumes:
        - name: music
          {{- if .Values.music.persistence.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.music.persistence.existingClaim }}
          {{- else if .Values.music.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "soundspan.fullname" . }}-music
          {{- else if .Values.music.hostPath }}
          hostPath:
            path: {{ .Values.music.hostPath }}
            type: Directory
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.backend.persistence.cache.enabled }}
        - name: cache
          {{- if eq $backendCacheType "emptyDir" }}
          emptyDir: {}
          {{- else if .Values.backend.persistence.cache.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.backend.persistence.cache.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "soundspan.fullname" . }}-backend-cache
          {{- end }}
        {{- end }}
        {{- if .Values.backend.persistence.logs.enabled }}
        - name: logs
          {{- if eq $backendLogsType "emptyDir" }}
          emptyDir: {}
          {{- else if .Values.backend.persistence.logs.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.backend.persistence.logs.existingClaim }}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "soundspan.fullname" . }}-backend-logs
          {{- end }}
        {{- end }}
      {{- with .Values.backend.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- with .Values.global.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- with .Values.global.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- else }}
      {{- with .Values.global.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "soundspan.fullname" . }}-backend
  labels:
    {{- include "soundspan.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.metrics.serviceMonitor.enabled }}
    - port: {{ .Values.backend.port }}
      targetPort: http
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "soundspan.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 4 }}
{{- if $backendPdbEnabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "soundspan.fullname" . }}-backend
  labels:
    {{- include "soundspan.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "soundspan.componentSelectorLabels" (dict "context" . "component" "backend") | nindent 6 }}
  {{- if hasKey .Values.backend.pdb "maxUnavailable" }}
  maxUnavailable: {{ .Values.backend.pdb.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.backend.pdb.minAvailable | default 1 }}
  {{- end }}
{{- end }}
---
{{- if and .Values.backend.persistence.cache.enabled (eq $backendCacheType "pvc") (not .Values.backend.persistence.cache.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "soundspan.fullname" . }}-backend-cache
  labels:
    {{- include "soundspan.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.backend.persistence.cache.accessMode }}
  resources:
    requests:
      storage: {{ .Values.backend.persistence.cache.size }}
  {{- if .Values.backend.persistence.cache.storageClass }}
  storageClassName: {{ .Values.backend.persistence.cache.storageClass | quote }}
  {{- end }}
{{- end }}
---
{{- if and .Values.backend.persistence.logs.enabled (eq $backendLogsType "pvc") (not .Values.backend.persistence.logs.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "soundspan.fullname" . }}-backend-logs
  labels:
    {{- include "soundspan.componentLabels" (dict "context" . "component" "backend") | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.backend.persistence.logs.accessMode }}
  resources:
    requests:
      storage: {{ .Values.backend.persistence.logs.size }}
  {{- if .Values.backend.persistence.logs.storageClass }}
  storageClassName: {{ .Values.backend.persistence.logs.storageClass | quote }}
  {{- end }}
{{- end }}
{{- end }}
